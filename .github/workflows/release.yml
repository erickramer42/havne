name: Release

# A version tag publishes a release with these downloads: a Windows x64
# zip (the app, the x86 and x64 J2534 surrogates, the Qt runtime and the
# Visual C++ runtime, running without Qt or Visual Studio), an Android
# arm64-v8a APK signed with the release key (ADR-0030), a Linux x86_64
# AppImage, and core alone for Linux as a deb and a tarball (ADR-0035);
# beside them the Windows executables' PDBs in a zip of their own
# (ADR-0034) and havne-cli's Linux debug info as a -dbgsym deb and a
# -debug tarball. Each comes with its SHA-256 and a signed build
# provenance (attested, and attached as a .intoto.jsonl), and one SPDX
# SBOM lists what each download contains, attested over them.
# A tag with -rcN publishes a pre-release, for a dry run.
# The tagged commit must already have passed CI (ci.yml's push run).
#
#   git tag v0.3.1 && git push origin v0.3.1
#
# A manual run rebuilds an existing tag and replaces the release's files:
#   gh workflow run release.yml -f tag=v0.3.1
#
# Jobs: gate (the tag and CI) -> windows, android and linux, side by side
# -> publish (the SBOM, checksums, provenance, the release). Each build
# job writes a <download>.components.json beside its download for the
# SBOM (packaging/sbom.py). Only android reads the
# signing key, from the "release" environment's secrets.
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+', 'v[0-9]+.[0-9]+.[0-9]+-rc[0-9]+']
  workflow_dispatch:
    inputs:
      tag:
        description: An existing tag to build and publish again, e.g. v0.3.1
        required: true
        type: string

permissions:
  contents: read

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  gate:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash   # -eo pipefail
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read         # read ci.yml's runs on the tagged commit
    env:
      GH_TOKEN: ${{ github.token }}
    outputs:
      version: ${{ steps.version.outputs.version }}
      notes_tag: ${{ steps.version.outputs.notes_tag }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}

      # The tag names the version the binaries report, so they must agree
      # before anything builds: v0.3.1 and v0.3.1-rc2 both need
      # project(Havne VERSION 0.3.1) in the root CMakeLists.txt.
      - name: Check the tag against the project version
        id: version
        run: |
          [[ "$TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)(-rc[0-9]+)?$ ]] || { echo "::error::$TAG is not vX.Y.Z or vX.Y.Z-rcN"; exit 1; }
          tag_version="${BASH_REMATCH[1]}"
          cmake_version=$(sed -n '/^project(Havne/,/)/s/^ *VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          if [ "$tag_version" != "$cmake_version" ]; then
            echo "::error::$TAG is version $tag_version, but CMakeLists.txt says $cmake_version"
            exit 1
          fi
          test -f "docs/releases/v$tag_version.md" || { echo "::error::no docs/releases/v$tag_version.md"; exit 1; }
          {
            echo "version=${TAG#v}"
            echo "notes_tag=v$tag_version"
            if [ -n "${BASH_REMATCH[2]}" ]; then echo "prerelease=--prerelease"; else echo "prerelease="; fi
          } >> "$GITHUB_OUTPUT"

      # The build jobs run no tests: ci.yml ran them when the commit was
      # pushed to main or dev (it never runs on tags). So the newest of
      # those push runs must have finished green, or a tag pushed early,
      # or on a red commit, would publish an untested build.
      - name: Check CI passed on the tagged commit
        run: |
          sha=$(git rev-parse HEAD)
          run=$(gh run list -R "$GITHUB_REPOSITORY" --workflow ci.yml --event push --commit "$sha" --limit 1 \
            --json status,conclusion,url \
            --jq '.[0] // empty | "\(.status) \(if (.conclusion // "") == "" then "none" else .conclusion end) \(.url)"')
          if [ -z "$run" ]; then
            echo "::error::ci.yml has no push run on $sha: push the commit to main or dev and let CI finish before tagging"
            exit 1
          fi
          read -r status conclusion url <<< "$run"
          if [ "$status" != completed ] || [ "$conclusion" != success ]; then
            echo "::error::CI on $sha is $status, conclusion $conclusion ($url): tag a commit whose CI passed"
            exit 1
          fi
          echo "CI passed on $sha: $url"

  windows:
    needs: gate
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      VERSION: ${{ needs.gate.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}

      # The same Qt install as ci.yml's win-build; see the notes there.
      - name: Install aqtinstall (pinned master commit)
        run: python -m pip install "aqtinstall @ git+https://github.com/miurahr/aqtinstall@076e1659807d0b362a3ed684d54c2e9c775eb9c7"

      - name: Install Qt 6.12.0
        run: |
          $prefix = "${env:GITHUB_WORKSPACE}\Qt\6.12.0\msvc2022_64"
          New-Item -ItemType Directory -Force -Path $prefix | Out-Null
          python -m aqt install-qt windows desktop 6.12.0 win64_msvc2022_64 --outputdir "${env:GITHUB_WORKSPACE}\Qt" --external 7z
          "QT_PREFIX=$prefix" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      # build-win32 first: the app's configure finds its x86 surrogate and
      # copies it next to havne.exe; the app build adds its own tree's
      # x64 one. No tests in either tree; ci.yml ran them on the commit,
      # and verify.sh runs the cross-arch suite. LINK (read by link.exe
      # itself) makes each binary record only its PDB's file name, not
      # the runner's path; CMake's Visual Studio generator can't pass the
      # % through (ADR-0034 §1), and stage.ps1 checks it took.
      - name: Build the x86 surrogate
        env:
          LINK: /PDBALTPATH:%_PDB%
        run: |
          cmake -B build-win32 -A Win32 -DHAVNE_BUILD_CORE_ONLY=ON -DBUILD_TESTING=OFF
          cmake --build build-win32 --config Release --target ecuio-j2534-surrogate

      - name: Build the app
        env:
          LINK: /PDBALTPATH:%_PDB%
        run: |
          cmake -B build -DCMAKE_PREFIX_PATH="$env:QT_PREFIX" -DBUILD_TESTING=OFF
          cmake --build build --config Release --target havne

      - name: Stage, check and zip
        run: pwsh -NoProfile -File packaging/windows/stage.ps1 -Version $env:VERSION

      - name: Upload the zips
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows
          path: |
            dist/havne-${{ env.VERSION }}-windows-x64.zip
            dist/havne-${{ env.VERSION }}-windows-x64.zip.components.json
            dist/havne-${{ env.VERSION }}-windows-x64-symbols.zip
          if-no-files-found: error
          retention-days: 1

  android:
    needs: gate
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash   # -eo pipefail
    timeout-minutes: 25
    # The release key's secrets live in this environment, which only
    # release tags and main may deploy to (docs/development.md,
    # "The Android release key")
    environment: release
    env:
      VERSION: ${{ needs.gate.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}

      # The same kit, NDK and JDK as ci.yml's android-build; see the notes
      # there.
      - name: Install Qt 6.12.0 (android_arm64_v8a + linux host)
        uses: jurplel/install-qt-action@b344308e4483fc892e0d27b3cd1b173ebdd95f06 # v4.5.0
        with:
          version: '6.12.0'
          host: 'all_os'
          target: 'android'
          arch: 'android_arm64_v8a'
          modules: 'qtconnectivity'
          extra: '--autodesktop'

      - name: Select NDK r27 and JDK 21
        run: |
          NDK=$(ls -d "$ANDROID_SDK_ROOT"/ndk/27.* 2>/dev/null | sort -V | tail -n 1 || true)
          [ -n "$NDK" ] || { echo "::error::No NDK r27 under $ANDROID_SDK_ROOT/ndk"; exit 1; }
          [ -n "${JAVA_HOME_21_X64:-}" ] || { echo "::error::JAVA_HOME_21_X64 is not set on this runner image"; exit 1; }
          echo "APP_NDK_ROOT=$NDK" >> "$GITHUB_ENV"
          echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"

      # Release, unlike CI's Debug build: optimized, not debuggable, and
      # unsigned until the next step
      - name: Build the Release APK
        run: |
          "$QT_ROOT_DIR/bin/qt-cmake" -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=OFF \
            -DANDROID_SDK_ROOT="$ANDROID_SDK_ROOT" \
            -DANDROID_NDK_ROOT="$APP_NDK_ROOT"
          cmake --build build
          cmake --build build --target apk

      # The keystore exists on the runner only for this step
      - name: Sign and check
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          HAVNE_KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
        run: |
          [ -n "$KEYSTORE_B64" ] && [ -n "$HAVNE_KEYSTORE_PASS" ] \
            || { echo "::error::the release environment has no ANDROID_KEYSTORE_B64 or ANDROID_KEYSTORE_PASS"; exit 1; }
          export HAVNE_KEYSTORE="$RUNNER_TEMP/release.p12"
          trap 'rm -f "$HAVNE_KEYSTORE"' EXIT
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$HAVNE_KEYSTORE"
          unsigned=$(find build -path '*outputs/apk/release/*' -name '*-unsigned.apk' | head -n 1)
          [ -n "$unsigned" ] || { echo "::error::the build made no unsigned Release APK"; exit 1; }
          bash packaging/android/sign-apk.sh "$unsigned" "$VERSION" dist

      # For the SBOM: the APK's native libraries by origin, and the Java
      # libraries Gradle resolved for the Release build (offline: the
      # build above fetched them)
      - name: The APK's component list
        run: |
          qt=$(sed -n 's/^set(PACKAGE_VERSION "\([0-9.]*\)")$/\1/p' "$QT_ROOT_DIR/lib/cmake/Qt6/Qt6ConfigVersionImpl.cmake")
          [ -n "$qt" ] || { echo "::error::no Qt version in the kit's Qt6ConfigVersionImpl.cmake"; exit 1; }
          (cd build/app/android-build && ./gradlew -q --offline dependencies --configuration releaseRuntimeClasspath) \
            > "$RUNNER_TEMP/gradle-deps.txt"
          python3 packaging/sbom.py apk --apk "dist/havne-$VERSION-android-arm64-v8a.apk" \
            --qt "$qt" --ndk "$(basename "$APP_NDK_ROOT")" --gradle "$RUNNER_TEMP/gradle-deps.txt"

      - name: Upload the APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android
          path: |
            dist/havne-${{ env.VERSION }}-android-arm64-v8a.apk
            dist/havne-${{ env.VERSION }}-android-arm64-v8a.apk.components.json
          if-no-files-found: error
          retention-days: 1

  # On 24.04, the oldest distribution supported: a binary runs where glibc
  # is at least its build machine's. The same builds as ci.yml's
  # linux-appimage and linux-packages, which ran on the tagged commit.
  linux:
    needs: gate
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash   # -eo pipefail
    timeout-minutes: 30
    env:
      VERSION: ${{ needs.gate.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}

      - name: Install Qt 6.12.0 desktop (linux_gcc_64)
        uses: jurplel/install-qt-action@b344308e4483fc892e0d27b3cd1b173ebdd95f06 # v4.5.0
        with:
          version: '6.12.0'
          host: 'linux'
          target: 'desktop'
          arch: 'linux_gcc_64'

      # The xcb platform plugin's libraries, which linuxdeploy bundles;
      # the probes' header; the packages' tools
      - name: Install the build's packages
        run: |
          sudo apt-get update && sudo apt-get install -y libgl1-mesa-dev libxkbcommon-dev libegl1 libopengl0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-shape0 libxcb-sync1 libxcb-xfixes0 libxcb-xinerama0 libxcb-xkb1 libxkbcommon-x11-0 \
            systemtap-sdt-dev ninja-build dpkg-dev

      # rcc's embedded files, the squashfs and the core packages take the
      # commit's time, so a rebuild of the tag matches (ADR-0035 §4)
      - name: Date the build by the commit
        run: |
          t=$(git log -1 --format=%ct)
          echo "SOURCE_DATE_EPOCH=$t" >> "$GITHUB_ENV"
          echo "QT_RCC_SOURCE_DATE_OVERRIDE=$t" >> "$GITHUB_ENV"

      - name: Build and pack the AppImage
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR"
          cmake --build build
          QMAKE="$QT_ROOT_DIR/bin/qmake" bash packaging/linux/make-appimage.sh "$VERSION" build dist

      - name: Build the core packages
        run: bash packaging/linux/make-core-packages.sh "$VERSION" build-packages dist

      - name: Upload the Linux files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux
          path: |
            dist/havne-${{ env.VERSION }}-linux-x86_64.AppImage*
            dist/havne-core*
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: [gate, windows, android, linux]
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash   # -eo pipefail
    timeout-minutes: 10
    permissions:
      contents: write       # create the release and upload its files
      id-token: write       # sign the build provenance
      attestations: write   # store it
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.gate.outputs.version }}
      NOTES_TAG: ${{ needs.gate.outputs.notes_tag }}
      PRERELEASE: ${{ needs.gate.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}

      - name: Download the builds
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true

      # LF line ends (sha256sum's own): sha256sum -c reads a CR as part
      # of the name
      # Every file the release publishes but the provenance, by name
      - name: Name the downloads
        run: |
          {
            echo "ZIP=dist/havne-$VERSION-windows-x64.zip"
            echo "SYMBOLS=dist/havne-$VERSION-windows-x64-symbols.zip"
            echo "APK=dist/havne-$VERSION-android-arm64-v8a.apk"
            echo "APPIMAGE=dist/havne-$VERSION-linux-x86_64.AppImage"
            echo "DEB=dist/havne-core_${VERSION}_amd64.deb"
            echo "DBGSYM=dist/havne-core-dbgsym_${VERSION}_amd64.deb"
            echo "TARBALL=dist/havne-core-$VERSION-linux-x86_64.tar.gz"
            echo "DEBUG_TARBALL=dist/havne-core-$VERSION-linux-x86_64-debug.tar.gz"
            echo "SBOM=dist/havne-$VERSION.spdx.json"
          } >> "$GITHUB_ENV"

      # One document over every download but the debug files, which carry
      # no component of their own; validated before anything is published.
      # The commit's time dates it, so a rerun writes the same document.
      - name: The SBOM
        run: |
          SOURCE_DATE_EPOCH=$(git log -1 --format=%ct) python3 packaging/sbom.py build \
            --version "$VERSION" --tag "$TAG" --out "$SBOM" "$ZIP" "$APK" "$APPIMAGE" "$DEB" "$TARBALL"
          python3 -m venv "$RUNNER_TEMP/spdx"
          "$RUNNER_TEMP/spdx/bin/pip" install --require-hashes -r .github/spdx-requirements.txt
          "$RUNNER_TEMP/spdx/bin/pyspdxtools" -i "$SBOM"

      - name: Checksums
        run: |
          (cd dist && sha256sum "${ZIP#dist/}" "${SYMBOLS#dist/}" "${APK#dist/}" "${APPIMAGE#dist/}" \
            "${DEB#dist/}" "${DBGSYM#dist/}" "${TARBALL#dist/}" "${DEBUG_TARBALL#dist/}" "${SBOM#dist/}" \
            > SHA256SUMS.txt)
          cat dist/SHA256SUMS.txt

      - name: Attest the zip's build provenance
        id: attest-zip
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/havne-${{ env.VERSION }}-windows-x64.zip

      - name: Attest the symbols' build provenance
        id: attest-symbols
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/havne-${{ env.VERSION }}-windows-x64-symbols.zip

      - name: Attest the APK's build provenance
        id: attest-apk
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/havne-${{ env.VERSION }}-android-arm64-v8a.apk

      # One attestation over the five Linux files: its bundle names each
      - name: Attest the Linux files' build provenance
        id: attest-linux
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            ${{ env.APPIMAGE }}
            ${{ env.DEB }}
            ${{ env.DBGSYM }}
            ${{ env.TARBALL }}
            ${{ env.DEBUG_TARBALL }}

      # Checked with gh attestation verify <download> -R erickramer42/havne
      # --predicate-type https://spdx.dev/Document/v2.3
      - name: Attest the SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          sbom-path: ${{ env.SBOM }}
          subject-path: |
            ${{ env.ZIP }}
            ${{ env.APK }}
            ${{ env.APPIMAGE }}
            ${{ env.DEB }}
            ${{ env.TARBALL }}

      # The same signed provenance (a Sigstore bundle) as a release file
      # beside each download. OpenSSF Scorecard's Signed-Releases check
      # reads release files, not GitHub's attestation store, and counts
      # *.intoto.jsonl as provenance. A download can also be checked
      # against its file with gh attestation verify --bundle.
      - name: Copy the provenance into dist
        env:
          ZIP_BUNDLE: ${{ steps.attest-zip.outputs.bundle-path }}
          SYMBOLS_BUNDLE: ${{ steps.attest-symbols.outputs.bundle-path }}
          APK_BUNDLE: ${{ steps.attest-apk.outputs.bundle-path }}
          LINUX_BUNDLE: ${{ steps.attest-linux.outputs.bundle-path }}
        run: |
          cp "$ZIP_BUNDLE" "$ZIP.intoto.jsonl"
          cp "$SYMBOLS_BUNDLE" "$SYMBOLS.intoto.jsonl"
          cp "$APK_BUNDLE" "$APK.intoto.jsonl"
          for f in "$APPIMAGE" "$DEB" "$DBGSYM" "$TARBALL" "$DEBUG_TARBALL"; do
            cp "$LINUX_BUNDLE" "$f.intoto.jsonl"
          done

      - name: Publish the release
        run: |
          files=("$SBOM" dist/SHA256SUMS.txt)
          for f in "$ZIP" "$SYMBOLS" "$APK" "$APPIMAGE" "$DEB" "$DBGSYM" "$TARBALL" "$DEBUG_TARBALL"; do
            files+=("$f" "$f.intoto.jsonl")
          done
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "${files[@]}" --clobber
          else
            gh release create "$TAG" "${files[@]}" --verify-tag \
              --title "Havne $TAG" --notes-file "docs/releases/$NOTES_TAG.md" $PRERELEASE
          fi
