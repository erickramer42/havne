name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]
  # Actions > CI > Run workflow, or: gh workflow run ci.yml --ref <branch>
  # [-f ios_smoke=true | -f smoke_only=true]. A manual run is how a feature
  # branch gets CI, so it skips the 20-minute iOS simulator smoke unless
  # asked: ios_smoke adds it to the whole run, smoke_only runs it with
  # core-and-tests alone. [ios-smoke] in a pushed commit's message also
  # asks for it; re-running a push run replays the push and skips the
  # smoke again.
  workflow_dispatch:
    inputs:
      ios_smoke:
        description: Also run the iOS simulator smoke (about 20 minutes)
        type: boolean
        default: false
      smoke_only:
        description: >-
          Run only core-and-tests and the iOS simulator smoke, skipping the
          other platform jobs
        type: boolean
        default: false

permissions:
  contents: read

# Every job sets timeout-minutes at roughly 3-5x its usual duration, so a
# hung download, build or simulator fails within minutes instead of
# holding a runner for GitHub's 6 h default.
jobs:
  core-and-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # systemtap-sdt-dev: <sys/sdt.h>, so core carries its USDT probes
      # (ADR-0034 §4) and ProbeNotesTest runs
      - name: Build core + tests (no Qt present)
        run: |
          sudo apt-get update && sudo apt-get install -y systemtap-sdt-dev
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DHAVNE_BUILD_CORE_ONLY=ON
          cmake --build build

      - name: Run tests
        run: |
          ctest --test-dir build -C Release --output-on-failure

  # Core and its Qt-free tests under AddressSanitizer and
  # UndefinedBehaviorSanitizer; LeakSanitizer runs with ASan on Linux, so
  # a session a test forgets to destroy fails here. The J2534 suites are
  # Windows-only, so this covers core, signals, obd2 and the C ABI check.
  core-sanitizers:
    if: ${{ !inputs.smoke_only }}
    runs-on: ubuntu-latest
    needs: core-and-tests
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build core + tests with ASan and UBSan
        run: |
          sudo apt-get update && sudo apt-get install -y systemtap-sdt-dev
          SAN="-fsanitize=address,undefined -fno-sanitize-recover=undefined -fno-omit-frame-pointer"
          cmake -B build -DCMAKE_BUILD_TYPE=Debug -DHAVNE_BUILD_CORE_ONLY=ON \
            -DCMAKE_C_FLAGS="$SAN" -DCMAKE_CXX_FLAGS="$SAN" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
          cmake --build build

      # The simulated CAN bus, as linux-build brings it up, so the
      # SocketCAN worker and the vcan suites run under the sanitizers too
      - name: Bring up vcan0
        run: |
          sudo modprobe vcan
          sudo modprobe can-isotp
          sudo ip link add dev vcan0 type vcan
          sudo ip link set vcan0 mtu 72
          sudo ip link set up vcan0

      # ECUIO_VCAN_REQUIRED: VcanTest and SocketCanBusTest fail rather than
      # skip without vcan0
      - name: Run tests
        env:
          UBSAN_OPTIONS: print_stacktrace=1
          ECUIO_VCAN_REQUIRED: '1'
        run: ctest --test-dir build --output-on-failure --no-tests=error

      # The interface down and up again needs CAP_NET_ADMIN, as in
      # linux-build
      - name: SocketCAN as root (the interface down and up)
        env:
          UBSAN_OPTIONS: print_stacktrace=1
          ECUIO_VCAN_REQUIRED: '1'
          ECUIO_VCAN_ROOT_REQUIRED: '1'
        run: >-
          sudo --preserve-env=UBSAN_OPTIONS,ECUIO_VCAN_REQUIRED,ECUIO_VCAN_ROOT_REQUIRED
          build/tests/test_vcan
          --gtest_filter='SocketCanBusTest.TheInterfaceGoingDownIsAHardFailureThatRecovers'

  # libFuzzer harnesses (fuzz/) under ASan and UBSan; fuzz/CMakeLists.txt
  # instruments core and the harnesses. Scorecard's Fuzzing check counts
  # the harnesses themselves (a .cpp defining LLVMFuzzerTestOneInput);
  # this job runs them. The fuzzer and sanitizer runtimes come from
  # libclang-rt-<major>-dev, installed for the image's clang and proved
  # by a one-line link before the build. Not ctest tests: the suite
  # stays deterministic. A committed seed corpus (the recorder's
  # frames.csv is the natural source) is future work.
  fuzz:
    if: ${{ !inputs.smoke_only }}
    runs-on: ubuntu-latest
    needs: core-and-tests
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Clang and its runtimes
        run: |
          sudo apt-get update
          sudo apt-get install -y clang
          # Derived from the compiler that will be used, so a runner
          # image that moves its default clang doesn't strand us on a
          # version that isn't in the archive.
          VER=$(clang -dumpversion | cut -d. -f1)
          sudo apt-get install -y "libclang-rt-${VER}-dev"

      - name: Verify libFuzzer links
        run: |
          printf 'extern "C" int LLVMFuzzerTestOneInput(const unsigned char*, unsigned long){return 0;}\n' > /tmp/fuzzcheck.cpp
          clang++ -fsanitize=fuzzer /tmp/fuzzcheck.cpp -o /tmp/fuzzcheck
          /tmp/fuzzcheck -runs=1
          clang++ --version

      - name: Build fuzzers (Clang, ASan+UBSan)
        # Optimized with symbols: -O0 runs several times fewer inputs a
        # second, and core has no asserts for NDEBUG to lose.
        run: |
          cmake -B build-fuzz -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DHAVNE_BUILD_CORE_ONLY=ON -DBUILD_TESTING=OFF \
            -DECUIO_BUILD_FUZZERS=ON \
            -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++
          cmake --build build-fuzz --target fuzz_decode_signal fuzz_validate_set fuzz_uds_query \
            fuzz_elm327_reply fuzz_replay_file

      - name: fuzz_decode_signal (60 s)
        run: |
          mkdir -p artifacts
          ./build-fuzz/fuzz/fuzz_decode_signal -max_total_time=60 -timeout=25 \
            -rss_limit_mb=2560 -artifact_prefix=artifacts/ -print_final_stats=1

      - name: fuzz_validate_set (60 s)
        run: |
          mkdir -p artifacts
          ./build-fuzz/fuzz/fuzz_validate_set -max_total_time=60 -timeout=25 \
            -rss_limit_mb=2560 -artifact_prefix=artifacts/ -print_final_stats=1

      - name: fuzz_uds_query (60 s)
        run: |
          mkdir -p artifacts
          ./build-fuzz/fuzz/fuzz_uds_query -max_total_time=60 -timeout=25 \
            -rss_limit_mb=2560 -artifact_prefix=artifacts/ -print_final_stats=1

      - name: fuzz_elm327_reply (60 s)
        run: |
          mkdir -p artifacts
          ./build-fuzz/fuzz/fuzz_elm327_reply -max_total_time=60 -timeout=25 \
            -rss_limit_mb=2560 -artifact_prefix=artifacts/ -print_final_stats=1

      - name: fuzz_replay_file (60 s)
        run: |
          mkdir -p artifacts
          ./build-fuzz/fuzz/fuzz_replay_file -max_total_time=60 -timeout=25 \
            -rss_limit_mb=2560 -artifact_prefix=artifacts/ -print_final_stats=1

      - name: Upload fuzz artifacts
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-artifacts
          path: artifacts/
          if-no-files-found: ignore

  # clang-tidy over core/ and surrogate/ with .clang-tidy's checks (the
  # static analyzer and the bug-finding families); any warning fails it.
  # Windows, because the J2534 layer and the surrogate compile only
  # there, and a Ninja tree from a Developer shell, because the Visual
  # Studio generator writes no compile database. Nothing is built.
  # clang-tidy is the hash-pinned wheel in
  # .github/clang-tidy-requirements.txt, bumped by hand.
  clang-tidy:
    if: ${{ !inputs.smoke_only }}
    runs-on: windows-latest
    needs: core-and-tests
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install clang-tidy
        run: python -m pip install --require-hashes -r .github/clang-tidy-requirements.txt

      - name: clang-tidy (core, J2534, surrogate)
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" `
            -latest -products * -property installationPath `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64
          Import-Module "$vs\Common7\Tools\Microsoft.VisualStudio.DevShell.dll"
          Enter-VsDevShell -VsInstallPath $vs -SkipAutomaticLocation `
            -DevCmdArguments '-arch=x64 -host_arch=x64'
          cmake -B build-tidy -G Ninja -DHAVNE_BUILD_CORE_ONLY=ON `
            -DBUILD_TESTING=OFF -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          clang-tidy --version
          & "$env:ProgramFiles\Git\bin\bash.exe" scripts/tidy.sh build-tidy

  win-build:
    if: ${{ !inputs.smoke_only }}
    runs-on: windows-latest
    needs: core-and-tests
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # aqtinstall from a pinned master commit: Qt 6.11 split the Windows
      # x64 repository per toolchain, and the fix (aqtinstall #1000) isn't
      # in a PyPI release yet (3.3.0 is the newest). Move back to PyPI
      # once 3.4.0 ships; Dependabot doesn't track a git pin.
      - name: Install aqtinstall (pinned master commit)
        run: python -m pip install "aqtinstall @ git+https://github.com/miurahr/aqtinstall@076e1659807d0b362a3ed684d54c2e9c775eb9c7"

      # --external 7z extracts with the runner's 7-Zip instead of py7zr,
      # which fails sporadically on Windows with Bad7zFile. aqtinstall
      # verifies each archive's SHA-256 before extracting, so that error
      # is py7zr's, on good bytes. install-qt-action avoids it by pinning
      # py7zr 1.1.0, but aqtinstall master requires 1.1.3 or later.
      - name: Install Qt 6.12.0
        run: |
          # aqtinstall #1002: --external 7z extracts archives in parallel
          # and 7-Zip's directory creation races on first extract.
          # Pre-create the install root to close the window.
          $prefix = "${env:GITHUB_WORKSPACE}\Qt\6.12.0\msvc2022_64"
          New-Item -ItemType Directory -Force -Path $prefix | Out-Null
          
          python -m aqt install-qt windows desktop 6.12.0 win64_msvc2022_64 --outputdir "${env:GITHUB_WORKSPACE}\Qt" --external 7z
          "QT_PREFIX=$prefix" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build full app
        run: |
          cmake -B build -DCMAKE_PREFIX_PATH="$env:QT_PREFIX"
          cmake --build build --config Release
      - name: Run tests
        run: ctest --test-dir build -C Release --output-on-failure --no-tests=error
      # The replay fixture through the bridge (tests/bench_bridge.cpp): its
      # table goes to the run's summary, and the step fails only on a
      # broken invariant or a bound far below the dev machine's figures
      - name: Load test
        shell: bash
        run: build/tests/Release/bench_bridge.exe --load | tee -a "$GITHUB_STEP_SUMMARY"

  # Line coverage for the README badge: the whole suite under
  # OpenCppCoverage (scripts/coverage.sh), uploaded to Codecov. Windows,
  # because only here do the J2534 stack and the surrogate run. On pushes
  # and manual runs, not pull requests: it is a second, unoptimized build.
  # Pass/fail stays with win-build; a timing case that misses its bounds
  # under the tool lowers the number, it doesn't fail this job.
  win-coverage:
    if: ${{ !inputs.smoke_only && github.event_name != 'pull_request' }}
    runs-on: windows-latest
    needs: core-and-tests
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The same Qt install as win-build; see the notes there.
      - name: Install aqtinstall (pinned master commit)
        run: python -m pip install "aqtinstall @ git+https://github.com/miurahr/aqtinstall@076e1659807d0b362a3ed684d54c2e9c775eb9c7"

      - name: Install Qt 6.12.0
        run: |
          $prefix = "${env:GITHUB_WORKSPACE}\Qt\6.12.0\msvc2022_64"
          New-Item -ItemType Directory -Force -Path $prefix | Out-Null
          python -m aqt install-qt windows desktop 6.12.0 win64_msvc2022_64 --outputdir "${env:GITHUB_WORKSPACE}\Qt" --external 7z
          "QT_PREFIX=$prefix" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install OpenCppCoverage
        run: choco install opencppcoverage --version=0.9.9.0 --no-progress -y

      # The runner has no Pass-Thru driver, so the fake DLL the build
      # makes is registered as one: discovery walks a real entry and the
      # discovery test demands it. REG_EXPAND_SZ takes the path through
      # the environment expansion, and the copy in each registry view
      # through the dedupe. Three broken entries beside it, an empty
      # FUNCTIONLIBRARY, a number and a relative path, are ones
      # discovery must skip.
      - name: Register the fake DLL as a Pass-Thru device
        run: |
          $dll = '%GITHUB_WORKSPACE%\build-coverage\tests\RelWithDebInfo\fake_j2534.dll'
          foreach ($view in '64', '32') {
            reg add "HKLM\SOFTWARE\PassThruSupport.04.04\Havne fake" /v FUNCTIONLIBRARY /t REG_EXPAND_SZ /d $dll /reg:$view /f
            if ($LASTEXITCODE -ne 0) { exit 1 }
          }
          $root = 'HKLM:\SOFTWARE\PassThruSupport.04.04'
          New-Item -Path "$root\Havne empty", "$root\Havne number", "$root\Havne relative" -Force | Out-Null
          New-ItemProperty -Path "$root\Havne empty" -Name FUNCTIONLIBRARY -Value '' -PropertyType String -Force | Out-Null
          New-ItemProperty -Path "$root\Havne number" -Name FUNCTIONLIBRARY -Value 1 -PropertyType DWord -Force | Out-Null
          New-ItemProperty -Path "$root\Havne relative" -Name FUNCTIONLIBRARY -Value 'fake_j2534.dll' -PropertyType String -Force | Out-Null

      - name: Measure coverage
        shell: bash
        run: bash scripts/coverage.sh

      - name: Upload to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: Testing/coverage/cobertura.xml
          disable_search: true
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true

  macos-build:
    if: ${{ !inputs.smoke_only }}
    runs-on: macos-latest
    needs: core-and-tests
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Qt 6.12.0
        uses: jurplel/install-qt-action@b344308e4483fc892e0d27b3cd1b173ebdd95f06 # v4.5.0
        with:
          version: '6.12.0'
          host: 'mac'
          target: 'desktop'
          arch: 'clang_64'

      - name: Build full app
        run: |
          cmake -B build -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR"
          cmake --build build
      - name: Run tests
        run: ctest --test-dir build --output-on-failure --no-tests=error

  linux-build:
    if: ${{ !inputs.smoke_only }}
    runs-on: ubuntu-latest
    needs: core-and-tests
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Qt 6.7+ names the Linux desktop arch linux_gcc_64 (gcc_64 no
      # longer resolves for 6.12.0).
      - name: Install Qt 6.12.0 desktop (linux_gcc_64)
        uses: jurplel/install-qt-action@b344308e4483fc892e0d27b3cd1b173ebdd95f06 # v4.5.0
        with:
          version: '6.12.0'
          host: 'linux'
          target: 'desktop'
          arch: 'linux_gcc_64'

      # libegl1 and libopengl0: QtGui's runtime libraries, which test_qml
      # loads (offscreen, so nothing for X11 or a GPU); systemtap-sdt-dev
      # and bpftrace: core's USDT probes and the step that traces them
      - name: Build full app
        run: |
          sudo apt-get update && sudo apt-get install -y libgl1-mesa-dev libxkbcommon-dev libegl1 libopengl0 \
            systemtap-sdt-dev bpftrace
          cmake -B build -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR"
          cmake --build build
      # The simulated CAN bus (tests/vcan_bus.h): vcan and can-isotp load
      # as installed on the hosted Ubuntu runners. MTU 72 takes CAN FD
      # frames (the mock's 12-byte telemetry), whatever the kernel's
      # default; it's set before the link goes up, as vcan requires
      - name: Bring up vcan0
        run: |
          sudo modprobe vcan
          sudo modprobe can-isotp
          sudo ip link add dev vcan0 type vcan
          sudo ip link set vcan0 mtu 72
          sudo ip link set up vcan0
      # ECUIO_VCAN_REQUIRED: VcanTest and SocketCanBusTest fail rather than
      # skip without vcan0
      - name: Run tests
        env:
          ECUIO_VCAN_REQUIRED: '1'
        run: ctest --test-dir build --output-on-failure --no-tests=error
      # The one SocketCAN case that sets the interface down and up again
      # needs CAP_NET_ADMIN; it skips in the run above, and runs here
      - name: SocketCAN as root (the interface down and up)
        env:
          ECUIO_VCAN_REQUIRED: '1'
          ECUIO_VCAN_ROOT_REQUIRED: '1'
        run: >-
          sudo --preserve-env=ECUIO_VCAN_REQUIRED,ECUIO_VCAN_ROOT_REQUIRED
          build/tests/test_vcan
          --gtest_filter='SocketCanBusTest.TheInterfaceGoingDownIsAHardFailureThatRecovers'
      # Core's probes fire in a running program (ADR-0034 §4): bpftrace
      # attaches to havne-cli's and counts a mock:// stream's
      - name: USDT probes under bpftrace
        run: sudo sh tests/probe_trace.sh build/cli/havne-cli
      - name: Load test
        shell: bash   # -o pipefail: tee must not hide the bench's exit status
        run: build/tests/bench_bridge --load | tee -a "$GITHUB_STEP_SUMMARY"

  # The C ABI against the newest release's (scripts/abi-check.sh,
  # libabigail): an incompatible change fails, an addition is reported
  abi:
    if: ${{ !inputs.smoke_only }}
    runs-on: ubuntu-latest
    needs: core-and-tests
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # the tags, and the base release's tree
      - name: Install libabigail and Ninja
        run: sudo apt-get update && sudo apt-get install -y abigail-tools ninja-build
      - name: Compare the C ABI with the newest release
        shell: bash
        run: |
          bash scripts/abi-check.sh | tee abi.txt
          { echo '### C ABI'; echo; echo '```'; tail -n 40 abi.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  # The Linux AppImage (packaging/linux/make-appimage.sh), on the oldest
  # Ubuntu it supports: an AppImage runs where glibc is at least its
  # build machine's
  linux-appimage:
    if: ${{ !inputs.smoke_only }}
    runs-on: ubuntu-24.04
    needs: core-and-tests
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Qt 6.12.0 desktop (linux_gcc_64)
        uses: jurplel/install-qt-action@b344308e4483fc892e0d27b3cd1b173ebdd95f06 # v4.5.0
        with:
          version: '6.12.0'
          host: 'linux'
          target: 'desktop'
          arch: 'linux_gcc_64'

      # rcc's embedded files and the squashfs take the commit's time, not
      # the checkout's, so two builds of one commit match (ADR-0035 §4)
      - name: Date the build by the commit
        run: |
          t=$(git log -1 --format=%ct)
          echo "SOURCE_DATE_EPOCH=$t" >> "$GITHUB_ENV"
          echo "QT_RCC_SOURCE_DATE_OVERRIDE=$t" >> "$GITHUB_ENV"

      # The xcb platform plugin's libraries, which linuxdeploy bundles
      - name: Build the Release app
        run: |
          sudo apt-get update && sudo apt-get install -y libgl1-mesa-dev libxkbcommon-dev libegl1 libopengl0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-shape0 libxcb-sync1 libxcb-xfixes0 libxcb-xinerama0 libxcb-xkb1 libxkbcommon-x11-0 \
            systemtap-sdt-dev
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR"
          cmake --build build

      - name: Pack and check the AppImage
        run: |
          VERSION=$(sed -n '/^project(Havne/,/)/s/^ *VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          QMAKE="$QT_ROOT_DIR/bin/qmake" bash packaging/linux/make-appimage.sh "$VERSION-ci" build dist
          sha256sum dist/*.AppImage

      - name: Upload the AppImage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: havne-linux-x86_64
          path: dist/*.AppImage
          if-no-files-found: error
          retention-days: 14

  # The core packages (ADR-0035): a deb, its -dbgsym and two tarballs,
  # on 24.04 like the release's. Built twice by reprotest, the second
  # time in another folder, locale, time zone, umask, CPU count and so on;
  # every byte must match. user_group is left out: it needs other
  # accounts on the runner. Then installed and used as a user would.
  linux-packages:
    if: ${{ !inputs.smoke_only }}
    runs-on: ubuntu-24.04
    needs: core-and-tests
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build dpkg-dev systemtap-sdt-dev reprotest diffoscope gdb pkg-config

      - name: Build twice under reprotest
        run: |
          VERSION=$(sed -n '/^project(Havne/,/)/s/^ *VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          echo "VERSION=$VERSION-ci" >> "$GITHUB_ENV"
          SOURCE_DATE_EPOCH=$(git log -1 --format=%ct) reprotest --min-cpus="$(nproc)" \
            --variations=-user_group \
            "bash packaging/linux/make-core-packages.sh $VERSION-ci build-packages dist" 'dist/*'

      - name: Build, install and use
        run: |
          bash packaging/linux/make-core-packages.sh "$VERSION" build-packages dist
          bash tests/package_check.sh dist "$VERSION"

      # packaging/sbom.py over these packages' component lists, and its
      # self-test's document, each validated as the release's is
      - name: The SBOM
        run: |
          python3 -m venv "$RUNNER_TEMP/spdx"
          "$RUNNER_TEMP/spdx/bin/pip" install --require-hashes -r .github/spdx-requirements.txt
          python3 packaging/sbom.py selftest --out "$RUNNER_TEMP/selftest.spdx.json"
          python3 packaging/sbom.py build --version "$VERSION" --tag "v$VERSION" --out "$RUNNER_TEMP/core.spdx.json" \
            "dist/havne-core_${VERSION}_amd64.deb" "dist/havne-core-$VERSION-linux-x86_64.tar.gz"
          for f in selftest core; do "$RUNNER_TEMP/spdx/bin/pyspdxtools" -i "$RUNNER_TEMP/$f.spdx.json"; done

      - name: Upload the packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: havne-core-linux-x86_64
          path: dist/havne-core*
          if-no-files-found: error
          retention-days: 14

  # Cross builds (Android, iOS) are build-only: BUILD_TESTING=OFF, because
  # gtest_discover_tests runs each test binary at build time, which can't
  # work for a target the runner can't execute.
  android-build:
    if: ${{ !inputs.smoke_only }}
    runs-on: ubuntu-latest
    needs: core-and-tests
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Qt 6.7+ publishes Android kits under the all_os host. A mobile kit
      # needs the desktop Qt of the build host too; --autodesktop installs it.
      # qtconnectivity is QtBluetooth, the phone's links (ADR-0028 §2).
      - name: Install Qt 6.12.0 (android_arm64_v8a + linux host)
        uses: jurplel/install-qt-action@b344308e4483fc892e0d27b3cd1b173ebdd95f06 # v4.5.0
        with:
          version: '6.12.0'
          host: 'all_os'
          target: 'android'
          arch: 'android_arm64_v8a'
          modules: 'qtconnectivity'
          extra: '--autodesktop'

      # Qt 6.12 for Android wants NDK r27 and JDK 21. The Ubuntu 24.04 and
      # 26.04 images both ship them (NDK 27.x is ANDROID_NDK_ROOT's
      # default; JDK 21 is JAVA_HOME_21_X64), but image defaults move with
      # image updates. Select both by version and fail clearly if either
      # is gone, rather than building with whatever the default became.
      - name: Select NDK r27 and JDK 21
        run: |
          # "|| true": with no match, ls fails, and under the runner's
          # -eo pipefail that would exit here, before the error below.
          NDK=$(ls -d "$ANDROID_SDK_ROOT"/ndk/27.* 2>/dev/null | sort -V | tail -n 1 || true)
          if [ -z "$NDK" ]; then
            echo "::error::No NDK r27 under $ANDROID_SDK_ROOT/ndk"
            ls "$ANDROID_SDK_ROOT/ndk"
            exit 1
          fi
          if [ -z "${JAVA_HOME_21_X64:-}" ]; then
            echo "::error::JAVA_HOME_21_X64 is not set on this runner image"
            exit 1
          fi
          echo "APP_NDK_ROOT=$NDK" >> "$GITHUB_ENV"
          echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"
          echo "NDK $(basename "$NDK")"
          "$JAVA_HOME_21_X64/bin/java" -version

      - name: Build APK
        run: |
          ls "$(dirname "$QT_ROOT_DIR")"
          "$QT_ROOT_DIR/bin/qt-cmake" -B build \
            -DBUILD_TESTING=OFF \
            -DANDROID_SDK_ROOT="$ANDROID_SDK_ROOT" \
            -DANDROID_NDK_ROOT="$APP_NDK_ROOT"
          cmake --build build
          cmake --build build --target apk

      # Core's TCP socket needs INTERNET; Bluetooth needs CONNECT and SCAN,
      # the scan never for location, on Android 12 and later (ADR-0028 §2
      # and its appendix of 2026-10-28). A manifest without them fails
      # here, not on a phone.
      - name: Check the manifest's permissions, minimum SDK and icon
        run: |
          MANIFEST=$(find build -path '*android-build*' -name AndroidManifest.xml -not -path '*/intermediates/*' | head -n 1)
          if [ -z "$MANIFEST" ]; then
            echo "::error::No generated AndroidManifest.xml under build/"
            exit 1
          fi
          echo "$MANIFEST"
          grep -n 'uses-permission' "$MANIFEST"
          grep -q 'android.permission.INTERNET' "$MANIFEST" \
            || { echo "::error::$MANIFEST declares no INTERNET permission"; exit 1; }
          grep -q 'android.permission.BLUETOOTH_CONNECT' "$MANIFEST" \
            || { echo "::error::$MANIFEST declares no BLUETOOTH_CONNECT permission"; exit 1; }
          grep 'android.permission.BLUETOOTH_SCAN' "$MANIFEST" | grep -q 'neverForLocation' \
            || { echo "::error::$MANIFEST declares no BLUETOOTH_SCAN never for location"; exit 1; }
          if grep -q 'ACCESS_FINE_LOCATION' "$MANIFEST"; then
            echo "::warning::$MANIFEST asks for location, which the BLE scan doesn't need"
          fi
          # The minimum SDK, in androiddeployqt's gradle.properties or the
          # manifest itself
          BUILD_DIR=$(dirname "$MANIFEST")
          grep -n -E 'qtMinSdkVersion|minSdkVersion' "$BUILD_DIR/gradle.properties" "$MANIFEST" 2>/dev/null || true
          grep -q -E '(qtMinSdkVersion *= *31|minSdkVersion="31")' "$BUILD_DIR/gradle.properties" "$MANIFEST" 2>/dev/null \
            || { echo "::error::the app's minimum SDK isn't 31 (Android 12)"; exit 1; }
          # The package id (permanent: another is another app) and the
          # version from project() (ADR-0001's appendix of 2026-10-28)
          VERSION=$(sed -n '/^project(Havne/,/)/s/^ *VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          grep -n -E 'package=|versionName|versionCode' "$MANIFEST"
          grep -q 'package="io.github.erickramer42.havne"' "$MANIFEST" \
            || { echo "::error::$MANIFEST's package isn't io.github.erickramer42.havne"; exit 1; }
          grep -q "android:versionName=\"$VERSION\"" "$MANIFEST" \
            || { echo "::error::$MANIFEST's version name isn't $VERSION"; exit 1; }
          # The launcher's label, capitalized (QT_ANDROID_APP_NAME)
          grep -q 'android:label="Havne"' "$MANIFEST" \
            || { echo "::error::$MANIFEST's label isn't Havne"; exit 1; }
          # QT_ANDROID_APP_ICON's adaptive icon, not Qt's default
          grep -n 'android:icon' "$MANIFEST"
          grep -q 'android:icon="@mipmap/ic_launcher"' "$MANIFEST" \
            || { echo "::error::$MANIFEST doesn't name @mipmap/ic_launcher"; exit 1; }
          # Background sessions (ADR-0029): Qt's GUI loop kept running, and
          # the foreground service with its permissions and wake lock
          grep -A1 'android.app.background_running' "$MANIFEST" | grep -q 'android:value="true"' \
            || { echo "::error::$MANIFEST doesn't set android.app.background_running to true"; exit 1; }
          grep -A3 'SessionService' "$MANIFEST" | grep -q 'foregroundServiceType="connectedDevice"' \
            || { echo "::error::$MANIFEST has no SessionService of type connectedDevice"; exit 1; }
          for p in FOREGROUND_SERVICE FOREGROUND_SERVICE_CONNECTED_DEVICE CHANGE_NETWORK_STATE POST_NOTIFICATIONS WAKE_LOCK; do
            grep -q "android.permission.$p\"" "$MANIFEST" \
              || { echo "::error::$MANIFEST declares no $p permission"; exit 1; }
          done
          # No backup: the app's files can hold the VIN (docs/security-assurance.md)
          grep -q 'android:allowBackup="false"' "$MANIFEST" \
            || { echo "::error::$MANIFEST doesn't turn backup off"; exit 1; }
          grep -q 'android:dataExtractionRules="@xml/data_extraction_rules"' "$MANIFEST" \
            || { echo "::error::$MANIFEST names no data extraction rules"; exit 1; }

      # The debug-signed APK, for sideloading onto a phone (ADR-0028 §3).
      # Each run signs with a new debug key, so a phone uninstalls the
      # previous build before installing the next.
      - name: Upload APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: havne-android-arm64-v8a
          path: build/**/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14

  ios-build:
    if: ${{ !inputs.smoke_only }}
    runs-on: macos-latest
    needs: core-and-tests
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Qt 6.12.0 (ios + macOS host)
        uses: jurplel/install-qt-action@b344308e4483fc892e0d27b3cd1b173ebdd95f06 # v4.5.0
        with:
          version: '6.12.0'
          host: 'mac'
          target: 'ios'
          arch: 'ios'
          extra: '--autodesktop'

      # qt-cmake applies Qt's iOS toolchain and its minimum deployment
      # target (iOS 18 for Qt 6.12), so neither is set by hand.
      - name: Build for device (no code signing)
        run: |
          ls "$(dirname "$QT_ROOT_DIR")"
          "$QT_ROOT_DIR/bin/qt-cmake" -B build -G Xcode \
            -DBUILD_TESTING=OFF \
            -DCMAKE_OSX_ARCHITECTURES=arm64
          cmake --build build --config Release -- CODE_SIGNING_ALLOWED=NO

  # Launch smoke on the iOS Simulator: install, launch, and check the app
  # is still running 45 s later. Qt 6.12's simulator libraries are x86_64
  # only, so this runs on an Intel runner where the simulator is native.
  # GitHub has announced the end of Intel macOS runners for Fall 2027;
  # after that this needs Rosetta plus the universal iOS platform, or
  # arm64 simulator libraries from Qt.
  #
  # Runs on request only, not on pushes, pull requests or plain manual
  # runs: it takes 20-30 min against a few minutes for the rest of CI.
  # Request it with a manual run that ticks ios_smoke (the whole run) or
  # smoke_only (the smoke and core-and-tests alone), on any branch, or
  # with "[ios-smoke]" in the pushed commit's message. A re-run replays
  # the original event, so re-running a skipped smoke skips it again.
  ios-simulator-smoke:
    if: >-
      (github.event_name == 'workflow_dispatch' &&
      (inputs.ios_smoke || inputs.smoke_only)) ||
      (github.event_name == 'push' &&
      contains(github.event.head_commit.message, '[ios-smoke]'))
    runs-on: macos-15-intel
    needs: core-and-tests
    # Runs have taken 19.5-24 min on the Intel runner.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Qt 6.12.0 (ios + macOS host)
        uses: jurplel/install-qt-action@b344308e4483fc892e0d27b3cd1b173ebdd95f06 # v4.5.0
        with:
          version: '6.12.0'
          host: 'mac'
          target: 'ios'
          arch: 'ios'
          extra: '--autodesktop'

      # Newest available iPhone on iOS 18 or later (Qt 6.12's floor). It
      # boots while the app builds; "Wait for simulator" joins it. That
      # also keeps the launch off a simulator still settling after a
      # cold boot, the likely cause of the first run's blank frame.
      - name: Pick and start simulator
        run: |
          UDID=$(xcrun simctl list devices available --json | jq -r '
            [.devices | to_entries[]
             | select(.key | test("SimRuntime\\.iOS-"))
             | (.key | capture("iOS-(?<maj>[0-9]+)-(?<min>[0-9]+)")
                     | [(.maj | tonumber), (.min | tonumber)]) as $v
             | select($v[0] >= 18)
             | .value[] | select(.name | startswith("iPhone"))
             | {udid, v: $v}]
            | sort_by(.v) | last | .udid // empty')
          if [ -z "$UDID" ]; then
            echo "::error::No available iPhone simulator on iOS 18 or later"
            xcrun simctl list devices available
            exit 1
          fi
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID"

      # Qt's toolchain leaves an explicit sysroot and arch alone, so these
      # select the simulator SDK and Qt's x86_64 simulator slice.
      - name: Build for simulator (x86_64, no code signing)
        run: |
          "$QT_ROOT_DIR/bin/qt-cmake" -B build -G Xcode \
            -DBUILD_TESTING=OFF \
            -DCMAKE_OSX_SYSROOT=iphonesimulator \
            -DCMAKE_OSX_ARCHITECTURES=x86_64
          cmake --build build --config Release -- CODE_SIGNING_ALLOWED=NO

      - name: Wait for simulator
        run: |
          xcrun simctl bootstatus "$UDID" -b
          # Qt Quick renders through Metal; record what the VM exposes.
          system_profiler SPDisplaysDataType | grep -iE 'chipset|metal' || true
          mkdir -p smoke
          # Control shot before the app exists: if the home screen is
          # blank too, the runner's simulator display is at fault.
          xcrun simctl io "$UDID" screenshot smoke/home.png || true

      # main() returns -1 when QML fails to load, and a scene graph that
      # can't initialize aborts, so "still running" covers both. It does
      # not prove the app drew anything; the screenshots are for that.
      - name: Launch and check Havne stays up
        run: |
          APP=$(find build -type d -name Havne.app -path '*iphonesimulator*' | head -n 1)
          if [ -z "$APP" ]; then
            echo "::error::Havne.app not found under build/"
            exit 1
          fi
          BUNDLE_ID=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist")
          xcrun simctl install "$UDID" "$APP"
          # SIMCTL_CHILD_* variables reach the app. Qt on Apple platforms
          # logs to os_log unless forced to stderr. QSG_INFO logs the
          # scene graph's backend and device once the window is exposed,
          # so no QSG_INFO lines means it never got that far.
          OUT=$(SIMCTL_CHILD_QT_FORCE_STDERR_LOGGING=1 SIMCTL_CHILD_QSG_INFO=1 \
            xcrun simctl launch \
            --stdout="$PWD/smoke/stdout.log" --stderr="$PWD/smoke/stderr.log" \
            "$UDID" "$BUNDLE_ID")
          PID="${OUT##*: }"
          echo "Launched $BUNDLE_ID as pid $PID"
          # Two shots, so a slow first frame on the Intel VM shows up as a
          # blank 15 s shot followed by a drawn 45 s one.
          sleep 15
          xcrun simctl io "$UDID" screenshot smoke/launch-15s.png || true
          sleep 30
          xcrun simctl io "$UDID" screenshot smoke/launch-45s.png || true
          echo "--- Havne stderr ---"
          cat smoke/stderr.log 2>/dev/null || true
          echo "--- end stderr ---"
          if grep -q "QML FAILED TO LOAD" smoke/stderr.log 2>/dev/null; then
            echo "::error::QML failed to load"
            exit 1
          fi
          if ! kill -0 "$PID" 2>/dev/null; then
            echo "::error::Havne exited within 45 s of launch"
            exit 1
          fi
          echo "Havne still running after 45 s"

      - name: Collect crash reports
        if: failure()
        run: |
          mkdir -p smoke
          cp ~/Library/Logs/DiagnosticReports/Havne* smoke/ 2>/dev/null || true

      - name: Upload smoke artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-simulator-smoke
          path: smoke/
          if-no-files-found: ignore
