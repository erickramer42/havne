name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]
  # Actions > CI > Run workflow, or: gh workflow run ci.yml --ref <branch>
  # [-f smoke_only=true]. A manual run is the way to get the iOS simulator
  # smoke outside a pull request; re-running a push run replays the push
  # and skips the smoke again.
  workflow_dispatch:
    inputs:
      smoke_only:
        description: >-
          Run only core-and-tests and the iOS simulator smoke, skipping the
          other platform jobs
        type: boolean
        default: false

permissions:
  contents: read

# Every job sets timeout-minutes at roughly 3-5x its usual duration, so a
# hung download, build or simulator fails within minutes instead of
# holding a runner for GitHub's 6 h default.
jobs:
  core-and-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build core + tests (no Qt present)
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DQTTUNE_BUILD_CORE_ONLY=ON
          cmake --build build

      - name: Run tests
        run: |
          ctest --test-dir build -C Release --output-on-failure

  # Core and its Qt-free tests under AddressSanitizer and
  # UndefinedBehaviorSanitizer; LeakSanitizer runs with ASan on Linux, so
  # a session a test forgets to destroy fails here. The J2534 suites are
  # Windows-only, so this covers core, signals, obd2 and the C ABI check.
  core-sanitizers:
    if: ${{ !inputs.smoke_only }}
    runs-on: ubuntu-latest
    needs: core-and-tests
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build core + tests with ASan and UBSan
        run: |
          SAN="-fsanitize=address,undefined -fno-sanitize-recover=undefined -fno-omit-frame-pointer"
          cmake -B build -DCMAKE_BUILD_TYPE=Debug -DQTTUNE_BUILD_CORE_ONLY=ON \
            -DCMAKE_C_FLAGS="$SAN" -DCMAKE_CXX_FLAGS="$SAN" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
          cmake --build build

      - name: Run tests
        env:
          UBSAN_OPTIONS: print_stacktrace=1
        run: ctest --test-dir build --output-on-failure --no-tests=error

  # libFuzzer harnesses (fuzz/) under ASan and UBSan; fuzz/CMakeLists.txt
  # instruments core and the harnesses. Scorecard's Fuzzing check counts
  # the harnesses themselves (a .cpp defining LLVMFuzzerTestOneInput);
  # this job runs them. The fuzzer and sanitizer runtimes come from
  # libclang-rt-<major>-dev, installed for the image's clang and proved
  # by a one-line link before the build. Not ctest tests: the suite
  # stays deterministic. A committed seed corpus (the recorder's
  # frames.csv is the natural source) is future work.
  fuzz:
    if: ${{ !inputs.smoke_only }}
    runs-on: ubuntu-latest
    needs: core-and-tests
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Clang and its runtimes
        run: |
          sudo apt-get update
          sudo apt-get install -y clang
          # Derived from the compiler that will be used, so a runner
          # image that moves its default clang doesn't strand us on a
          # version that isn't in the archive.
          VER=$(clang -dumpversion | cut -d. -f1)
          sudo apt-get install -y "libclang-rt-${VER}-dev"

      - name: Verify libFuzzer links
        run: |
          printf 'extern "C" int LLVMFuzzerTestOneInput(const unsigned char*, unsigned long){return 0;}\n' > /tmp/fuzzcheck.cpp
          clang++ -fsanitize=fuzzer /tmp/fuzzcheck.cpp -o /tmp/fuzzcheck
          /tmp/fuzzcheck -runs=1
          clang++ --version

      - name: Build fuzzers (Clang, ASan+UBSan)
        # Optimized with symbols: -O0 runs several times fewer inputs a
        # second, and core has no asserts for NDEBUG to lose.
        run: |
          cmake -B build-fuzz -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DQTTUNE_BUILD_CORE_ONLY=ON -DBUILD_TESTING=OFF \
            -DECUIO_BUILD_FUZZERS=ON \
            -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++
          cmake --build build-fuzz --target fuzz_decode_signal fuzz_validate_set fuzz_uds_query

      - name: fuzz_decode_signal (60 s)
        run: |
          mkdir -p artifacts
          ./build-fuzz/fuzz/fuzz_decode_signal -max_total_time=60 -timeout=25 \
            -rss_limit_mb=2560 -artifact_prefix=artifacts/ -print_final_stats=1

      - name: fuzz_validate_set (60 s)
        run: |
          mkdir -p artifacts
          ./build-fuzz/fuzz/fuzz_validate_set -max_total_time=60 -timeout=25 \
            -rss_limit_mb=2560 -artifact_prefix=artifacts/ -print_final_stats=1

      - name: fuzz_uds_query (60 s)
        run: |
          mkdir -p artifacts
          ./build-fuzz/fuzz/fuzz_uds_query -max_total_time=60 -timeout=25 \
            -rss_limit_mb=2560 -artifact_prefix=artifacts/ -print_final_stats=1

      - name: Upload fuzz artifacts
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-artifacts
          path: artifacts/
          if-no-files-found: ignore

  win-build:
    if: ${{ !inputs.smoke_only }}
    runs-on: windows-latest
    needs: core-and-tests
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # aqtinstall from a pinned master commit: Qt 6.11 split the Windows
      # x64 repository per toolchain, and the fix (aqtinstall #1000) isn't
      # in a PyPI release yet (3.3.0 is the newest). Move back to PyPI
      # once 3.4.0 ships; Dependabot doesn't track a git pin.
      - name: Install aqtinstall (pinned master commit)
        run: python -m pip install "aqtinstall @ git+https://github.com/miurahr/aqtinstall@076e1659807d0b362a3ed684d54c2e9c775eb9c7"

      # --external 7z extracts with the runner's 7-Zip instead of py7zr,
      # which fails sporadically on Windows with Bad7zFile. aqtinstall
      # verifies each archive's SHA-256 before extracting, so that error
      # is py7zr's, on good bytes. install-qt-action avoids it by pinning
      # py7zr 1.1.0, but aqtinstall master requires 1.1.3 or later.
      - name: Install Qt 6.12.0
        run: |
          # aqtinstall #1002: --external 7z extracts archives in parallel
          # and 7-Zip's directory creation races on first extract.
          # Pre-create the install root to close the window.
          $prefix = "${env:GITHUB_WORKSPACE}\Qt\6.12.0\msvc2022_64"
          New-Item -ItemType Directory -Force -Path $prefix | Out-Null
          
          python -m aqt install-qt windows desktop 6.12.0 win64_msvc2022_64 --outputdir "${env:GITHUB_WORKSPACE}\Qt" --external 7z
          "QT_PREFIX=$prefix" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build full app
        run: |
          cmake -B build -DCMAKE_PREFIX_PATH="$env:QT_PREFIX"
          cmake --build build --config Release
      - name: Run tests
        run: ctest --test-dir build -C Release --output-on-failure --no-tests=error

  # Line coverage for the README badge: the whole suite under
  # OpenCppCoverage (scripts/coverage.sh), uploaded to Codecov. Windows,
  # because only here do the J2534 stack and the surrogate run. On pushes
  # and manual runs, not pull requests: it is a second, unoptimized build.
  # Pass/fail stays with win-build; a timing case that misses its bounds
  # under the tool lowers the number, it doesn't fail this job.
  win-coverage:
    if: ${{ !inputs.smoke_only && github.event_name != 'pull_request' }}
    runs-on: windows-latest
    needs: core-and-tests
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The same Qt install as win-build; see the notes there.
      - name: Install aqtinstall (pinned master commit)
        run: python -m pip install "aqtinstall @ git+https://github.com/miurahr/aqtinstall@076e1659807d0b362a3ed684d54c2e9c775eb9c7"

      - name: Install Qt 6.12.0
        run: |
          $prefix = "${env:GITHUB_WORKSPACE}\Qt\6.12.0\msvc2022_64"
          New-Item -ItemType Directory -Force -Path $prefix | Out-Null
          python -m aqt install-qt windows desktop 6.12.0 win64_msvc2022_64 --outputdir "${env:GITHUB_WORKSPACE}\Qt" --external 7z
          "QT_PREFIX=$prefix" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install OpenCppCoverage
        run: choco install opencppcoverage --version=0.9.9.0 --no-progress -y

      # The runner has no Pass-Thru driver, so the fake DLL the build
      # makes is registered as one: discovery walks a real entry and the
      # discovery test demands it. REG_EXPAND_SZ takes the path through
      # the environment expansion, and the copy in each registry view
      # through the dedupe. Three broken entries beside it, an empty
      # FUNCTIONLIBRARY, a number and a relative path, are ones
      # discovery must skip.
      - name: Register the fake DLL as a Pass-Thru device
        run: |
          $dll = '%GITHUB_WORKSPACE%\build-coverage\tests\RelWithDebInfo\fake_j2534.dll'
          foreach ($view in '64', '32') {
            reg add "HKLM\SOFTWARE\PassThruSupport.04.04\QtTune fake" /v FUNCTIONLIBRARY /t REG_EXPAND_SZ /d $dll /reg:$view /f
            if ($LASTEXITCODE -ne 0) { exit 1 }
          }
          $root = 'HKLM:\SOFTWARE\PassThruSupport.04.04'
          New-Item -Path "$root\QtTune empty", "$root\QtTune number", "$root\QtTune relative" -Force | Out-Null
          New-ItemProperty -Path "$root\QtTune empty" -Name FUNCTIONLIBRARY -Value '' -PropertyType String -Force | Out-Null
          New-ItemProperty -Path "$root\QtTune number" -Name FUNCTIONLIBRARY -Value 1 -PropertyType DWord -Force | Out-Null
          New-ItemProperty -Path "$root\QtTune relative" -Name FUNCTIONLIBRARY -Value 'fake_j2534.dll' -PropertyType String -Force | Out-Null

      - name: Measure coverage
        shell: bash
        run: bash scripts/coverage.sh

      - name: Upload to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: Testing/coverage/cobertura.xml
          disable_search: true
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true

  macos-build:
    if: ${{ !inputs.smoke_only }}
    runs-on: macos-latest
    needs: core-and-tests
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Qt 6.12.0
        uses: jurplel/install-qt-action@a9c63c7c123f3069cff414e7e482d95dfa9d8125 # v4.4.1
        with:
          version: '6.12.0'
          host: 'mac'
          target: 'desktop'
          arch: 'clang_64'

      - name: Build full app
        run: |
          cmake -B build -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR"
          cmake --build build
      - name: Run tests
        run: ctest --test-dir build --output-on-failure --no-tests=error

  linux-build:
    if: ${{ !inputs.smoke_only }}
    runs-on: ubuntu-latest
    needs: core-and-tests
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Qt 6.7+ names the Linux desktop arch linux_gcc_64 (gcc_64 no
      # longer resolves for 6.12.0).
      - name: Install Qt 6.12.0 desktop (linux_gcc_64)
        uses: jurplel/install-qt-action@a9c63c7c123f3069cff414e7e482d95dfa9d8125 # v4.4.1
        with:
          version: '6.12.0'
          host: 'linux'
          target: 'desktop'
          arch: 'linux_gcc_64'

      # libegl1 and libopengl0: QtGui's runtime libraries, which test_qml
      # loads (offscreen, so nothing for X11 or a GPU)
      - name: Build full app
        run: |
          sudo apt-get update && sudo apt-get install -y libgl1-mesa-dev libxkbcommon-dev libegl1 libopengl0
          cmake -B build -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR"
          cmake --build build
      - name: Run tests
        run: ctest --test-dir build --output-on-failure --no-tests=error

  # Cross builds (Android, iOS) are build-only: BUILD_TESTING=OFF, because
  # gtest_discover_tests runs each test binary at build time, which can't
  # work for a target the runner can't execute.
  android-build:
    if: ${{ !inputs.smoke_only }}
    runs-on: ubuntu-latest
    needs: core-and-tests
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Qt 6.7+ publishes Android kits under the all_os host. A mobile kit
      # needs the desktop Qt of the build host too; --autodesktop installs it.
      - name: Install Qt 6.12.0 (android_arm64_v8a + linux host)
        uses: jurplel/install-qt-action@a9c63c7c123f3069cff414e7e482d95dfa9d8125 # v4.4.1
        with:
          version: '6.12.0'
          host: 'all_os'
          target: 'android'
          arch: 'android_arm64_v8a'
          extra: '--autodesktop'

      # Qt 6.12 for Android wants NDK r27 and JDK 21. The Ubuntu 24.04 and
      # 26.04 images both ship them (NDK 27.x is ANDROID_NDK_ROOT's
      # default; JDK 21 is JAVA_HOME_21_X64), but image defaults move with
      # image updates. Select both by version and fail clearly if either
      # is gone, rather than building with whatever the default became.
      - name: Select NDK r27 and JDK 21
        run: |
          # "|| true": with no match, ls fails, and under the runner's
          # -eo pipefail that would exit here, before the error below.
          NDK=$(ls -d "$ANDROID_SDK_ROOT"/ndk/27.* 2>/dev/null | sort -V | tail -n 1 || true)
          if [ -z "$NDK" ]; then
            echo "::error::No NDK r27 under $ANDROID_SDK_ROOT/ndk"
            ls "$ANDROID_SDK_ROOT/ndk"
            exit 1
          fi
          if [ -z "${JAVA_HOME_21_X64:-}" ]; then
            echo "::error::JAVA_HOME_21_X64 is not set on this runner image"
            exit 1
          fi
          echo "QTTUNE_NDK_ROOT=$NDK" >> "$GITHUB_ENV"
          echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"
          echo "NDK $(basename "$NDK")"
          "$JAVA_HOME_21_X64/bin/java" -version

      - name: Build APK
        run: |
          ls "$(dirname "$QT_ROOT_DIR")"
          "$QT_ROOT_DIR/bin/qt-cmake" -B build \
            -DBUILD_TESTING=OFF \
            -DANDROID_SDK_ROOT="$ANDROID_SDK_ROOT" \
            -DANDROID_NDK_ROOT="$QTTUNE_NDK_ROOT"
          cmake --build build
          cmake --build build --target apk

  ios-build:
    if: ${{ !inputs.smoke_only }}
    runs-on: macos-latest
    needs: core-and-tests
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Qt 6.12.0 (ios + macOS host)
        uses: jurplel/install-qt-action@a9c63c7c123f3069cff414e7e482d95dfa9d8125 # v4.4.1
        with:
          version: '6.12.0'
          host: 'mac'
          target: 'ios'
          arch: 'ios'
          extra: '--autodesktop'

      # qt-cmake applies Qt's iOS toolchain and its minimum deployment
      # target (iOS 18 for Qt 6.12), so neither is set by hand.
      - name: Build for device (no code signing)
        run: |
          ls "$(dirname "$QT_ROOT_DIR")"
          "$QT_ROOT_DIR/bin/qt-cmake" -B build -G Xcode \
            -DBUILD_TESTING=OFF \
            -DCMAKE_OSX_ARCHITECTURES=arm64
          cmake --build build --config Release -- CODE_SIGNING_ALLOWED=NO

  # Launch smoke on the iOS Simulator: install, launch, and check the app
  # is still running 45 s later. Qt 6.12's simulator libraries are x86_64
  # only, so this runs on an Intel runner where the simulator is native.
  # GitHub has announced the end of Intel macOS runners for Fall 2027;
  # after that this needs Rosetta plus the universal iOS platform, or
  # arm64 simulator libraries from Qt.
  #
  # Runs on pull requests and on request, not on every push: it takes
  # 20-30 min against a few minutes for the rest of CI. Request it with a
  # manual run (Actions > CI > Run workflow, on any branch; tick
  # smoke_only to skip the other platform jobs), or with "[ios-smoke]" in
  # the pushed commit's message. A re-run replays the original event, so
  # re-running a skipped smoke skips it again.
  ios-simulator-smoke:
    if: >-
      github.event_name == 'pull_request' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' &&
      contains(github.event.head_commit.message, '[ios-smoke]'))
    runs-on: macos-15-intel
    needs: core-and-tests
    # Runs have taken 19.5-24 min on the Intel runner.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Qt 6.12.0 (ios + macOS host)
        uses: jurplel/install-qt-action@a9c63c7c123f3069cff414e7e482d95dfa9d8125 # v4.4.1
        with:
          version: '6.12.0'
          host: 'mac'
          target: 'ios'
          arch: 'ios'
          extra: '--autodesktop'

      # Newest available iPhone on iOS 18 or later (Qt 6.12's floor). It
      # boots while the app builds; "Wait for simulator" joins it. That
      # also keeps the launch off a simulator still settling after a
      # cold boot, the likely cause of the first run's blank frame.
      - name: Pick and start simulator
        run: |
          UDID=$(xcrun simctl list devices available --json | jq -r '
            [.devices | to_entries[]
             | select(.key | test("SimRuntime\\.iOS-"))
             | (.key | capture("iOS-(?<maj>[0-9]+)-(?<min>[0-9]+)")
                     | [(.maj | tonumber), (.min | tonumber)]) as $v
             | select($v[0] >= 18)
             | .value[] | select(.name | startswith("iPhone"))
             | {udid, v: $v}]
            | sort_by(.v) | last | .udid // empty')
          if [ -z "$UDID" ]; then
            echo "::error::No available iPhone simulator on iOS 18 or later"
            xcrun simctl list devices available
            exit 1
          fi
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID"

      # Qt's toolchain leaves an explicit sysroot and arch alone, so these
      # select the simulator SDK and Qt's x86_64 simulator slice.
      - name: Build for simulator (x86_64, no code signing)
        run: |
          "$QT_ROOT_DIR/bin/qt-cmake" -B build -G Xcode \
            -DBUILD_TESTING=OFF \
            -DCMAKE_OSX_SYSROOT=iphonesimulator \
            -DCMAKE_OSX_ARCHITECTURES=x86_64
          cmake --build build --config Release -- CODE_SIGNING_ALLOWED=NO

      - name: Wait for simulator
        run: |
          xcrun simctl bootstatus "$UDID" -b
          # Qt Quick renders through Metal; record what the VM exposes.
          system_profiler SPDisplaysDataType | grep -iE 'chipset|metal' || true
          mkdir -p smoke
          # Control shot before the app exists: if the home screen is
          # blank too, the runner's simulator display is at fault.
          xcrun simctl io "$UDID" screenshot smoke/home.png || true

      # main() returns -1 when QML fails to load, and a scene graph that
      # can't initialize aborts, so "still running" covers both. It does
      # not prove the app drew anything; the screenshots are for that.
      - name: Launch and check qttune stays up
        run: |
          APP=$(find build -type d -name qttune.app -path '*iphonesimulator*' | head -n 1)
          if [ -z "$APP" ]; then
            echo "::error::qttune.app not found under build/"
            exit 1
          fi
          BUNDLE_ID=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist")
          xcrun simctl install "$UDID" "$APP"
          # SIMCTL_CHILD_* variables reach the app. Qt on Apple platforms
          # logs to os_log unless forced to stderr. QSG_INFO logs the
          # scene graph's backend and device once the window is exposed,
          # so no QSG_INFO lines means it never got that far.
          OUT=$(SIMCTL_CHILD_QT_FORCE_STDERR_LOGGING=1 SIMCTL_CHILD_QSG_INFO=1 \
            xcrun simctl launch \
            --stdout="$PWD/smoke/stdout.log" --stderr="$PWD/smoke/stderr.log" \
            "$UDID" "$BUNDLE_ID")
          PID="${OUT##*: }"
          echo "Launched $BUNDLE_ID as pid $PID"
          # Two shots, so a slow first frame on the Intel VM shows up as a
          # blank 15 s shot followed by a drawn 45 s one.
          sleep 15
          xcrun simctl io "$UDID" screenshot smoke/launch-15s.png || true
          sleep 30
          xcrun simctl io "$UDID" screenshot smoke/launch-45s.png || true
          echo "--- qttune stderr ---"
          cat smoke/stderr.log 2>/dev/null || true
          echo "--- end stderr ---"
          if grep -q "QML FAILED TO LOAD" smoke/stderr.log 2>/dev/null; then
            echo "::error::QML failed to load"
            exit 1
          fi
          if ! kill -0 "$PID" 2>/dev/null; then
            echo "::error::qttune exited within 45 s of launch"
            exit 1
          fi
          echo "qttune still running after 45 s"

      - name: Collect crash reports
        if: failure()
        run: |
          mkdir -p smoke
          cp ~/Library/Logs/DiagnosticReports/qttune* smoke/ 2>/dev/null || true

      - name: Upload smoke artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-simulator-smoke
          path: smoke/
          if-no-files-found: ignore
