name: CI

# The PR to main (the one PR per release from dev, or a hotfix/* PR) is
# the gate, and the push its merge makes to main is the run the release
# job's CI gate reads (and the only one that saves the iOS kit's cache).
# Pushes to dev and feature branches get no run of their own: they are
# checked locally, and a manual run on dev checks one between releases.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Actions > CI > Run workflow, or: gh workflow run ci.yml --ref <branch>
  # [-f ios_smoke=true | -f smoke_only=true]. A manual run skips the
  # 20-minute iOS simulator smoke unless
  # asked: ios_smoke adds it to the whole run, smoke_only runs it with
  # core-and-tests alone. [ios-smoke] in a pushed commit's message also
  # asks for it; re-running a push run replays the push and skips the
  # smoke again. macos_repeat (-f macos_repeat='^BridgeTest\.Replay'
  # [-f macos_repeat_count=200]) runs the matching tests again on macOS
  # until one fails, for a failure seen once there (no Mac on hand).
  workflow_dispatch:
    inputs:
      macos_repeat:
        description: >-
          A ctest regex macos-build runs again until it fails (empty: no
          repeat)
        type: string
        default: ''
      macos_repeat_count:
        description: How many times macos_repeat runs at most
        type: number
        default: 200
      ios_smoke:
        description: Also run the iOS simulator smoke (about 20 minutes)
        type: boolean
        default: false
      smoke_only:
        description: >-
          Run only core-and-tests and the iOS simulator smoke, skipping the
          other platform jobs
        type: boolean
        default: false

permissions:
  contents: read

# A push to a PR's branch cancels the PR's run it supersedes: the newer
# run tests everything the older one would have. main's runs and manual
# runs are never canceled.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Every `cmake --build` and every ctest run (coverage.sh's too) runs this
# many jobs at once: without it Make builds one file at a time, MSBuild one
# project at a time and ctest one case at a time. The hosted Linux and
# Windows runners have four cores, the macOS ones three. The suite's cases
# wait more than they compute, and the ones that share a fixed resource
# (the vcan bus, the surrogate's log) are RUN_SERIAL, so verify.sh runs it
# 8 at a time.
#
# HAVNE_WARNINGS_AS_ERRORS is the CMake option's default (CMakeLists.txt):
# a GCC or Clang warning in first-party code fails the job. MSVC isn't
# gated.
env:
  CMAKE_BUILD_PARALLEL_LEVEL: '4'
  CTEST_PARALLEL_LEVEL: '4'
  HAVNE_WARNINGS_AS_ERRORS: 'ON'

# Every job sets timeout-minutes at roughly 3-5x its usual duration, so a
# hung download, build or simulator fails within minutes instead of
# holding a runner for GitHub's 6 h default. No job waits for another but
# android-build (for a runner slot): each starts at once, so a run takes as
# long as its longest job.
jobs:
  core-and-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # the tags, for the ABI check below

      # jsonschema for SchemaFixturesTest (schema/ against the committed
      # fixtures) and pytest for PythonTest.* (the havne package against
      # the shared core, python/tests/), the hash-pinned wheels in
      # .github/jsonschema-requirements.txt and pytest-requirements.txt,
      # bumped by hand. A venv, since the image's Python is externally
      # managed; the configure below takes it as the tests' Python.
      - name: Install jsonschema and pytest
        run: |
          python3 -m venv "$RUNNER_TEMP/schema"
          "$RUNNER_TEMP/schema/bin/python" -m pip install --require-hashes -r .github/jsonschema-requirements.txt
          "$RUNNER_TEMP/schema/bin/python" -m pip install --require-hashes -r .github/pytest-requirements.txt

      # systemtap-sdt-dev: <sys/sdt.h>, so core carries its USDT probes
      # (ADR-0034 section 4) and ProbeNotesTest runs
      - name: Build core + tests (no Qt present)
        run: |
          sudo apt-get update && sudo apt-get install -y systemtap-sdt-dev
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DHAVNE_BUILD_CORE_ONLY=ON \
            -DPython3_EXECUTABLE="$RUNNER_TEMP/schema/bin/python"
          cmake --build build

      # ECUIO_SCHEMA_REQUIRED: SchemaFixturesTest fails rather than skips
      # without jsonschema; ECUIO_PYTEST_REQUIRED: PythonTest.* fail
      # rather than skip without pytest
      - name: Run tests
        env:
          ECUIO_SCHEMA_REQUIRED: '1'
          ECUIO_PYTEST_REQUIRED: '1'
        run: |
          ctest --test-dir build -C Release --output-on-failure --no-tests=error

      # The C ABI against the newest release's (scripts/abi-check.sh,
      # libabigail): an incompatible change fails, an addition is reported.
      # Its own steps, run whatever the tests did, so one red doesn't hide
      # the other; the checkout above has the tags and the base release's tree
      - name: Install libabigail and Ninja
        if: ${{ (success() || failure()) && !inputs.smoke_only }}
        run: sudo apt-get update && sudo apt-get install -y abigail-tools ninja-build
      - name: Compare the C ABI with the newest release
        if: ${{ (success() || failure()) && !inputs.smoke_only }}
        shell: bash
        run: |
          # The summary is written whatever the verdict, and the check's
          # own status then ends the step: a failure is when it's read
          set +e
          bash scripts/abi-check.sh 2>&1 | tee abi.txt
          status=${PIPESTATUS[0]}
          set -e
          # The headers' verdict first: abidiff's report can run past 40
          # lines. An error before the headers' check leaves no verdict line
          { echo '### C ABI'; echo; echo '```'; grep -m 1 'public declaration' abi.txt || true
            tail -n 40 abi.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

  # Core and its Qt-free tests under AddressSanitizer and
  # UndefinedBehaviorSanitizer; LeakSanitizer runs with ASan on Linux, so
  # a session a test forgets to destroy fails here. The J2534 suites are
  # Windows-only, so this covers core, signals, obd2 and the C ABI check.
  core-sanitizers:
    if: ${{ !inputs.smoke_only }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # can-utils: candump, which CliTransferRunTest.candump logs vcan0
      # with (ECUIO_VCAN_REQUIRED fails it without one)
      - name: Build core + tests with ASan and UBSan
        run: |
          sudo apt-get update && sudo apt-get install -y systemtap-sdt-dev can-utils
          SAN="-fsanitize=address,undefined -fno-sanitize-recover=undefined -fno-omit-frame-pointer"
          cmake -B build -DCMAKE_BUILD_TYPE=Debug -DHAVNE_BUILD_CORE_ONLY=ON \
            -DCMAKE_C_FLAGS="$SAN" -DCMAKE_CXX_FLAGS="$SAN" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
          cmake --build build

      # The simulated CAN bus, as linux-build brings it up, so the
      # SocketCAN worker and the vcan suites run under the sanitizers too
      - name: Bring up vcan0
        run: |
          sudo modprobe vcan
          sudo modprobe can-isotp
          sudo ip link add dev vcan0 type vcan
          sudo ip link set vcan0 mtu 72
          sudo ip link set up vcan0

      # ECUIO_VCAN_REQUIRED: test_vcan's suites and CliPluginRunTest fail
      # rather than skip without vcan0
      - name: Run tests
        env:
          UBSAN_OPTIONS: print_stacktrace=1
          ECUIO_VCAN_REQUIRED: '1'
        run: ctest --test-dir build --output-on-failure --no-tests=error

      # The interface down and up again needs CAP_NET_ADMIN, as in
      # linux-build
      - name: SocketCAN as root (the interface down and up)
        env:
          UBSAN_OPTIONS: print_stacktrace=1
          ECUIO_VCAN_REQUIRED: '1'
          ECUIO_VCAN_ROOT_REQUIRED: '1'
        run: >-
          sudo --preserve-env=UBSAN_OPTIONS,ECUIO_VCAN_REQUIRED,ECUIO_VCAN_ROOT_REQUIRED
          build/tests/test_vcan
          --gtest_filter='SocketCanBusTest.TheInterfaceGoingDownIsAHardFailureThatRecovers'

  # libFuzzer harnesses (fuzz/) under ASan and UBSan; fuzz/CMakeLists.txt
  # instruments core and the harnesses. Scorecard's Fuzzing check counts
  # the harnesses themselves (a .cpp defining LLVMFuzzerTestOneInput);
  # this job runs them. The fuzzer and sanitizer runtimes come from
  # libclang-rt-<major>-dev, installed for the image's clang and proved
  # by a one-line link before the build. Not ctest tests: the suite
  # stays deterministic. The harnesses that read a structured format
  # (JSON, signal files, plugins, OBDb sets, the ELM327 emulator's
  # hosts) start from the seeds
  # fuzz/seeds.py builds from the committed fixtures: from nothing, 60 s
  # barely leaves the JSON reader. The others start empty.
  fuzz:
    if: ${{ !inputs.smoke_only }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FUZZERS: >-
        fuzz_decode_signal fuzz_validate_set fuzz_uds_query fuzz_elm327_reply
        fuzz_replay_file fuzz_socketcan_wire fuzz_diagnostics fuzz_isotp
        fuzz_vin fuzz_dtc fuzz_sim fuzz_elm327_emulator fuzz_recording
        fuzz_candump fuzz_request_bus fuzz_json fuzz_signal_file
        fuzz_plugin_manifest fuzz_obdb_import fuzz_csv_import fuzz_export
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Clang and its runtimes
        run: |
          sudo apt-get update
          sudo apt-get install -y clang
          # Derived from the compiler that will be used, so a runner
          # image that moves its default clang doesn't strand us on a
          # version that isn't in the archive.
          VER=$(clang -dumpversion | cut -d. -f1)
          sudo apt-get install -y "libclang-rt-${VER}-dev"

      - name: Verify libFuzzer links
        run: |
          printf 'extern "C" int LLVMFuzzerTestOneInput(const unsigned char*, unsigned long){return 0;}\n' > /tmp/fuzzcheck.cpp
          clang++ -fsanitize=fuzzer /tmp/fuzzcheck.cpp -o /tmp/fuzzcheck
          /tmp/fuzzcheck -runs=1
          clang++ --version

      - name: Build fuzzers (Clang, ASan+UBSan)
        # Optimized with symbols: -O0 runs several times fewer inputs a
        # second, and core has no asserts for NDEBUG to lose.
        run: |
          cmake -B build-fuzz -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DHAVNE_BUILD_CORE_ONLY=ON -DBUILD_TESTING=OFF \
            -DECUIO_BUILD_FUZZERS=ON \
            -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++
          cmake --build build-fuzz --target $FUZZERS

      # Each harness runs 60 s on one core, as many at once as the runner
      # has cores, each into its own log, from its corpus folder (the
      # seeds, or empty). Every log is printed in its own group, and the
      # step fails if any harness found something.
      - name: Run the fuzzers (60 s each)
        run: |
          mkdir -p artifacts fuzz-logs
          python3 fuzz/seeds.py corpus
          printf '%s\n' $FUZZERS | xargs -P "$(nproc)" -I{} sh -c \
            'mkdir -p corpus/{} && ./build-fuzz/fuzz/{} corpus/{} -max_total_time=60 -timeout=25 -rss_limit_mb=2560 \
               -artifact_prefix=artifacts/{}- -print_final_stats=1 > fuzz-logs/{}.log 2>&1 \
             || echo {} >> fuzz-logs/failed'
          for f in $FUZZERS; do
            echo "::group::$f"
            cat "fuzz-logs/$f.log"
            echo "::endgroup::"
          done
          if [ -f fuzz-logs/failed ]; then
            echo "::error::found by: $(tr '\n' ' ' < fuzz-logs/failed)"
            exit 1
          fi

      - name: Upload fuzz artifacts
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-artifacts
          path: |
            artifacts/
            fuzz-logs/
          if-no-files-found: ignore

  # clang-tidy over core/, surrogate/, cli/ and app/ with .clang-tidy's
  # checks (the static analyzer and the bug-finding families); any warning
  # fails it. Windows, because the J2534 layer and the surrogate compile
  # only there, and a Ninja tree from a Developer shell, because the
  # Visual Studio generator writes no compile database. The tree has Qt
  # for app/, and only the app's moc output is built (scripts/tidy.sh
  # --qt). clang-tidy is the hash-pinned wheel in
  # .github/clang-tidy-requirements.txt, bumped by hand.
  clang-tidy:
    if: ${{ !inputs.smoke_only }}
    runs-on: windows-latest
    timeout-minutes: 25
    # Three runners each check a third of the files (round robin by name,
    # scripts/tidy.sh's HAVNE_TIDY_SHARD); together they check the whole tree
    strategy:
      fail-fast: false
      matrix:
        shard: ['0/3', '1/3', '2/3']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install clang-tidy
        run: python -m pip install --require-hashes -r .github/clang-tidy-requirements.txt

      # The same Qt install as win-build, from win-build's cache entry
      # when there is one; see the notes there. Only win-build saves it.
      - name: Restore Qt 6.12.0 from the cache
        id: qt-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}\Qt
          key: qt-windows-6.12.0-win64_msvc2022_64-aqt-076e1659

      - name: Install aqtinstall (pinned master commit)
        if: steps.qt-cache.outputs.cache-hit != 'true'
        run: python -m pip install "aqtinstall @ git+https://github.com/miurahr/aqtinstall@076e1659807d0b362a3ed684d54c2e9c775eb9c7"

      - name: Install Qt 6.12.0
        if: steps.qt-cache.outputs.cache-hit != 'true'
        run: |
          $prefix = "${env:GITHUB_WORKSPACE}\Qt\6.12.0\msvc2022_64"
          New-Item -ItemType Directory -Force -Path $prefix | Out-Null
          python -m aqt install-qt windows desktop 6.12.0 win64_msvc2022_64 --outputdir "${env:GITHUB_WORKSPACE}\Qt" --external 7z

      - name: Point the build at Qt
        run: |
          $prefix = "${env:GITHUB_WORKSPACE}\Qt\6.12.0\msvc2022_64"
          if (-not (Test-Path "$prefix\bin\qmake.exe")) { Write-Error "no Qt at $prefix"; exit 1 }
          "QT_PREFIX=$prefix" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: clang-tidy (core, J2534, surrogate, CLI, app)
        env:
          HAVNE_TIDY_SHARD: ${{ matrix.shard }}
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" `
            -latest -products * -property installationPath `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64
          Import-Module "$vs\Common7\Tools\Microsoft.VisualStudio.DevShell.dll"
          Enter-VsDevShell -VsInstallPath $vs -SkipAutomaticLocation `
            -DevCmdArguments '-arch=x64 -host_arch=x64'
          clang-tidy --version
          & "$env:ProgramFiles\Git\bin\bash.exe" scripts/tidy.sh --qt ($env:QT_PREFIX -replace '\\', '/') build-tidy

  win-build:
    name: win-build (${{ matrix.shard }}/2)
    if: ${{ !inputs.smoke_only }}
    runs-on: windows-latest
    timeout-minutes: 20
    # Two runners, each with its own build, run alternate halves of ctest
    # (-I k,,2: every case once across the two); the first alone saves the
    # caches and runs the load test
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The kit from the Actions cache, so Qt's mirrors are out of the
      # path. One copy, saved by this job on main's pushes only (the
      # cache's 10 GB holds the iOS kit too); every other ref, the PR's
      # and release.yml's tags included, reads the default branch's. The
      # key names everything that decides the install's bytes.
      - name: Restore Qt 6.12.0 from the cache
        id: qt-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}\Qt
          key: qt-windows-6.12.0-win64_msvc2022_64-aqt-076e1659

      # aqtinstall from a pinned master commit: Qt 6.11 split the Windows
      # x64 repository per toolchain, and the fix (aqtinstall #1000) isn't
      # in a PyPI release yet (3.3.0 is the newest). Move back to PyPI
      # once 3.4.0 ships, and change the cache key with it; Dependabot
      # doesn't track a git pin.
      - name: Install aqtinstall (pinned master commit)
        if: steps.qt-cache.outputs.cache-hit != 'true'
        run: python -m pip install "aqtinstall @ git+https://github.com/miurahr/aqtinstall@076e1659807d0b362a3ed684d54c2e9c775eb9c7"

      # --external 7z extracts with the runner's 7-Zip instead of py7zr,
      # which fails sporadically on Windows with Bad7zFile. aqtinstall
      # verifies each archive's SHA-256 before extracting, so that error
      # is py7zr's, on good bytes. install-qt-action avoids it by pinning
      # py7zr 1.1.0, but aqtinstall master requires 1.1.3 or later.
      - name: Install Qt 6.12.0
        if: steps.qt-cache.outputs.cache-hit != 'true'
        run: |
          # aqtinstall #1002: --external 7z extracts archives in parallel
          # and 7-Zip's directory creation races on first extract.
          # Pre-create the install root to close the window.
          $prefix = "${env:GITHUB_WORKSPACE}\Qt\6.12.0\msvc2022_64"
          New-Item -ItemType Directory -Force -Path $prefix | Out-Null

          python -m aqt install-qt windows desktop 6.12.0 win64_msvc2022_64 --outputdir "${env:GITHUB_WORKSPACE}\Qt" --external 7z

      - name: Save Qt 6.12.0 to the cache (main only)
        if: steps.qt-cache.outputs.cache-hit != 'true' && github.ref == 'refs/heads/main' && matrix.shard == 1
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}\Qt
          key: ${{ steps.qt-cache.outputs.cache-primary-key }}

      - name: Point the build at Qt
        run: |
          $prefix = "${env:GITHUB_WORKSPACE}\Qt\6.12.0\msvc2022_64"
          if (-not (Test-Path "$prefix\bin\qmake.exe")) { Write-Error "no Qt at $prefix"; exit 1 }
          "QT_PREFIX=$prefix" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      # pytest for PythonTest.* (the havne package against the shared
      # core, the J2534 case through the fake DLL and the x64 surrogate),
      # in a venv the configure takes as the tests' Python, as
      # core-and-tests does; --system-site-packages, so it still sees
      # what the runner's Python has (jsonschema, where it does)
      - name: Install pytest
        run: |
          python -m venv --system-site-packages "$env:RUNNER_TEMP\py"
          & "$env:RUNNER_TEMP\py\Scripts\python.exe" -m pip install --require-hashes -r .github/pytest-requirements.txt

      # sccache from its GitHub release, checked against the SHA-256 that
      # the release publishes. Windows' Visual Studio generator ignores a
      # compiler launcher, so this job builds with Ninja in a Developer
      # shell, as clang-tidy does. The cache holds compiled objects (links
      # aren't cached), capped by SCCACHE_CACHE_SIZE; it is read on every
      # ref and saved only on dev and main, the Qt kit's rule.
      - name: Install sccache
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $zip = "$env:RUNNER_TEMP\sccache.zip"
          gh release download v0.19.0 -R mozilla/sccache -p sccache-v0.19.0-x86_64-pc-windows-msvc.zip -O $zip --clobber
          if ($LASTEXITCODE -ne 0) { Write-Error 'could not download sccache'; exit 1 }
          $sha = (Get-FileHash -Algorithm SHA256 $zip).Hash
          if ($sha -ne '28be8c61f6b2c89b9eb2869f6af7f78e6f992e78a8abae0ce855fcc129cbeac1') {
            Write-Error "unexpected SHA-256 $sha"; exit 1
          }
          Expand-Archive $zip -DestinationPath "$env:RUNNER_TEMP\sccache-bin"
          $bin = (Get-ChildItem "$env:RUNNER_TEMP\sccache-bin" -Recurse -Filter sccache.exe | Select-Object -First 1).DirectoryName
          $bin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "SCCACHE_DIR=$env:RUNNER_TEMP\sccache-cache" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "SCCACHE_CACHE_SIZE=1G" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Restore the compiler cache
        id: cc-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}\sccache-cache
          key: sccache-win-build-1-${{ github.sha }}
          restore-keys: sccache-win-build-1-

      - name: Build full app
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" `
            -latest -products * -property installationPath `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64
          Import-Module "$vs\Common7\Tools\Microsoft.VisualStudio.DevShell.dll"
          Enter-VsDevShell -VsInstallPath $vs -SkipAutomaticLocation `
            -DevCmdArguments '-arch=x64 -host_arch=x64'
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DHAVNE_EMBEDDED_DEBUG_INFO=ON `
            -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache `
            -DCMAKE_PREFIX_PATH="$env:QT_PREFIX" -DPython3_EXECUTABLE="$env:RUNNER_TEMP\py\Scripts\python.exe"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --build build
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          sccache --show-stats | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append

      - name: Save the compiler cache (dev and main)
        if: matrix.shard == 1 && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}\sccache-cache
          key: sccache-win-build-1-${{ github.sha }}

      # ECUIO_PYTEST_REQUIRED: PythonTest.* fail rather than skip without
      # pytest
      - name: Run tests
        env:
          ECUIO_PYTEST_REQUIRED: '1'
        run: ctest --test-dir build -C Release --output-on-failure --no-tests=error -I "${{ matrix.shard }},,2"
      # The replay fixture through the bridge (tests/bench_bridge.cpp): its
      # table goes to the run's summary, and the step fails only on a
      # broken invariant or a bound far below the dev machine's figures
      - name: Load test
        if: matrix.shard == 1
        shell: bash
        run: build/tests/bench_bridge.exe --load | tee -a "$GITHUB_STEP_SUMMARY"

      # The Visual Studio generator is what release.yml builds with, but this
      # job and win-coverage use Ninja (a compiler cache needs it). One shard
      # keeps the generator, the multi-config layout and /Zi in CI: core, the
      # shared library and the surrogate, no Qt, after the tests whatever
      # they did, so one red doesn't hide the other.
      - name: Configure and build with the Visual Studio generator
        if: ${{ (success() || failure()) && matrix.shard == 2 }}
        run: |
          cmake -B build-vs -DHAVNE_BUILD_CORE_ONLY=ON -DBUILD_TESTING=OFF
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --build build-vs --config Release --target ecuio ecuio-j2534-surrogate
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

  # Line coverage for the README badge: the whole suite under
  # OpenCppCoverage (scripts/coverage.sh), uploaded to Codecov. Windows,
  # because only here do the J2534 stack and the surrogate run. On pushes
  # and manual runs, not pull requests: it is a second, unoptimized build.
  # Pass/fail stays with win-build; a timing case that misses its bounds
  # under the tool lowers the number, it doesn't fail this job.
  win-coverage:
    if: ${{ !inputs.smoke_only && github.event_name != 'pull_request' }}
    runs-on: windows-latest
    timeout-minutes: 30
    # Three runners share the run, each with its own build: the gtest
    # binaries, and two interleaved slices of ctest's other cases
    # (scripts/coverage.sh --part). Codecov merges the three uploads of a commit.
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: gtest, part: gtest }
          - { name: ctest-1, part: 1/2 }
          - { name: ctest-2, part: 2/2 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The same Qt install as win-build, from win-build's cache entry
      # when there is one; see the notes there. Only win-build saves it.
      - name: Restore Qt 6.12.0 from the cache
        id: qt-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}\Qt
          key: qt-windows-6.12.0-win64_msvc2022_64-aqt-076e1659

      - name: Install aqtinstall (pinned master commit)
        if: steps.qt-cache.outputs.cache-hit != 'true'
        run: python -m pip install "aqtinstall @ git+https://github.com/miurahr/aqtinstall@076e1659807d0b362a3ed684d54c2e9c775eb9c7"

      - name: Install Qt 6.12.0
        if: steps.qt-cache.outputs.cache-hit != 'true'
        run: |
          $prefix = "${env:GITHUB_WORKSPACE}\Qt\6.12.0\msvc2022_64"
          New-Item -ItemType Directory -Force -Path $prefix | Out-Null
          python -m aqt install-qt windows desktop 6.12.0 win64_msvc2022_64 --outputdir "${env:GITHUB_WORKSPACE}\Qt" --external 7z

      - name: Point the build at Qt
        run: |
          $prefix = "${env:GITHUB_WORKSPACE}\Qt\6.12.0\msvc2022_64"
          if (-not (Test-Path "$prefix\bin\qmake.exe")) { Write-Error "no Qt at $prefix"; exit 1 }
          "QT_PREFIX=$prefix" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      # From its GitHub release, checked against its SHA-256 (winget's
      # manifest for 0.9.9.0 gives the same), rather than Chocolatey's
      # community feed, whose outages fail the job. The asset URL's host
      # can answer 504 for long stretches, so a failed download falls
      # back to the API through gh. An Inno Setup installer, into
      # Program Files, where coverage.sh looks for it.
      - name: Install OpenCppCoverage
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $exe = "$env:RUNNER_TEMP\OpenCppCoverageSetup-x64-0.9.9.0.exe"
          try {
            Invoke-WebRequest -Uri 'https://github.com/OpenCppCoverage/OpenCppCoverage/releases/download/release-0.9.9.0/OpenCppCoverageSetup-x64-0.9.9.0.exe' `
              -OutFile $exe -MaximumRetryCount 3 -RetryIntervalSec 10
          } catch {
            Write-Warning "Invoke-WebRequest failed ($_); trying gh release download"
            gh release download release-0.9.9.0 -R OpenCppCoverage/OpenCppCoverage -p OpenCppCoverageSetup-x64-0.9.9.0.exe -O $exe --clobber
            if ($LASTEXITCODE -ne 0) { Write-Error 'could not download OpenCppCoverage'; exit 1 }
          }
          $sha = (Get-FileHash -Algorithm SHA256 $exe).Hash
          if ($sha -ne '2295a733da39412c61e4f478677519dd0bb1893d88313ce56b468c9e50517888') {
            Write-Error "unexpected SHA-256 $sha"; exit 1
          }
          Start-Process -FilePath $exe -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-' -Wait
          if (-not (Test-Path 'C:\Program Files\OpenCppCoverage\OpenCppCoverage.exe')) {
            Write-Error 'OpenCppCoverage did not install'; exit 1
          }

      # The runner has no Pass-Thru driver, so the fake DLL the build
      # makes is registered as one: discovery walks a real entry and the
      # discovery test demands it. REG_EXPAND_SZ takes the path through
      # the environment expansion, and the copy in each registry view
      # through the dedupe. Three broken entries beside it, an empty
      # FUNCTIONLIBRARY, a number and a relative path, are ones
      # discovery must skip.
      - name: Register the fake DLL as a Pass-Thru device
        run: |
          $dll = '%GITHUB_WORKSPACE%\build-coverage\tests\fake_j2534.dll'
          foreach ($view in '64', '32') {
            reg add "HKLM\SOFTWARE\PassThruSupport.04.04\Havne fake" /v FUNCTIONLIBRARY /t REG_EXPAND_SZ /d $dll /reg:$view /f
            if ($LASTEXITCODE -ne 0) { exit 1 }
          }
          $root = 'HKLM:\SOFTWARE\PassThruSupport.04.04'
          New-Item -Path "$root\Havne empty", "$root\Havne number", "$root\Havne relative" -Force | Out-Null
          New-ItemProperty -Path "$root\Havne empty" -Name FUNCTIONLIBRARY -Value '' -PropertyType String -Force | Out-Null
          New-ItemProperty -Path "$root\Havne number" -Name FUNCTIONLIBRARY -Value 1 -PropertyType DWord -Force | Out-Null
          New-ItemProperty -Path "$root\Havne relative" -Name FUNCTIONLIBRARY -Value 'fake_j2534.dll' -PropertyType String -Force | Out-Null

      # The coverage tree is a Ninja tree under sccache (the Visual Studio
      # generator ignores a launcher; win-build (2/2) keeps that one built),
      # so it runs from a Developer shell. The objects are /Od and /Z7, a key
      # of their own; the gtest runner saves them on dev and main.
      - name: Install sccache
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $zip = "$env:RUNNER_TEMP\sccache.zip"
          gh release download v0.19.0 -R mozilla/sccache -p sccache-v0.19.0-x86_64-pc-windows-msvc.zip -O $zip --clobber
          if ($LASTEXITCODE -ne 0) { Write-Error 'could not download sccache'; exit 1 }
          $sha = (Get-FileHash -Algorithm SHA256 $zip).Hash
          if ($sha -ne '28be8c61f6b2c89b9eb2869f6af7f78e6f992e78a8abae0ce855fcc129cbeac1') {
            Write-Error "unexpected SHA-256 $sha"; exit 1
          }
          Expand-Archive $zip -DestinationPath "$env:RUNNER_TEMP\sccache-bin"
          $bin = (Get-ChildItem "$env:RUNNER_TEMP\sccache-bin" -Recurse -Filter sccache.exe | Select-Object -First 1).DirectoryName
          $bin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "SCCACHE_DIR=$env:RUNNER_TEMP\sccache-cache" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "SCCACHE_CACHE_SIZE=1G" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Restore the compiler cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}\sccache-cache
          key: sccache-win-coverage-1-${{ github.sha }}
          restore-keys: sccache-win-coverage-1-

      - name: Measure coverage
        shell: pwsh
        env:
          HAVNE_COVERAGE_NINJA: '1'
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" `
            -latest -products * -property installationPath `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64
          Import-Module "$vs\Common7\Tools\Microsoft.VisualStudio.DevShell.dll"
          Enter-VsDevShell -VsInstallPath $vs -SkipAutomaticLocation `
            -DevCmdArguments '-arch=x64 -host_arch=x64'
          # a Windows tool in System32 must not shadow Git's: the log shows which
          & "$env:ProgramFiles\Git\bin\bash.exe" -c 'command -v sort find timeout'
          & "$env:ProgramFiles\Git\bin\bash.exe" scripts/coverage.sh --part ${{ matrix.part }}
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          sccache --show-stats

      - name: Save the compiler cache (dev and main)
        if: matrix.name == 'gtest' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}\sccache-cache
          key: sccache-win-coverage-1-${{ github.sha }}

      # A case that fails only under the tool is named in the step's log and
      # explained in its own: the step doesn't fail, so this runs always.
      - name: Upload coverage logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-logs-${{ matrix.name }}
          path: Testing/coverage/cover-*.log
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: Testing/coverage/cobertura.xml
          name: coverage-${{ matrix.name }}
          disable_search: true
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true

  macos-build:
    name: macos-build (${{ matrix.shard }}/2)
    if: ${{ !inputs.smoke_only }}
    runs-on: macos-latest
    # The repeat runs a test hundreds of times: 60 minutes then
    timeout-minutes: ${{ inputs.macos_repeat != '' && 60 || 15 }}
    # Two runners, each with its own build, run alternate halves of ctest
    # (-I k,,2: every case once across the two); the repeat is on the first
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # cache: true restores the kit from the Actions cache, keyed by the
      # inputs and the runner's kernel; a miss installs it and saves it
      - name: Setup Qt 6.12.0
        uses: jurplel/install-qt-action@b344308e4483fc892e0d27b3cd1b173ebdd95f06 # v4.5.0
        with:
          cache: true
          version: '6.12.0'
          host: 'mac'
          target: 'desktop'
          arch: 'clang_64'

      # pytest for PythonTest.* (the havne package against the shared
      # core), in a venv the configure takes as the tests' Python, as
      # core-and-tests does; --system-site-packages, so it still sees
      # what the runner's Python has (jsonschema, where it does). The
      # package needs Python 3.11 or later
      - name: Install pytest
        run: |
          python3 -m venv --system-site-packages "$RUNNER_TEMP/py"
          "$RUNNER_TEMP/py/bin/python" -c 'import sys; assert sys.version_info >= (3, 11), sys.version'
          "$RUNNER_TEMP/py/bin/python" -m pip install --require-hashes -r .github/pytest-requirements.txt

      # sccache from its GitHub release, checked against the SHA-256 that
      # the release publishes, as win-build's: the objects are cached
      # (capped by SCCACHE_CACHE_SIZE), read on every ref and saved by
      # the first shard on dev and main only
      - name: Install sccache
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v0.19.0 -R mozilla/sccache -p sccache-v0.19.0-aarch64-apple-darwin.tar.gz -O "$RUNNER_TEMP/sccache.tar.gz" --clobber
          echo "a35a0b7d622618774bc1bb8102d72562dfb21e619f88b153b370d7f89bc286af  $RUNNER_TEMP/sccache.tar.gz" | shasum -a 256 -c -
          mkdir "$RUNNER_TEMP/sccache-bin"
          tar -xzf "$RUNNER_TEMP/sccache.tar.gz" -C "$RUNNER_TEMP/sccache-bin" --strip-components 1
          echo "$RUNNER_TEMP/sccache-bin" >> "$GITHUB_PATH"
          echo "SCCACHE_DIR=$RUNNER_TEMP/sccache-cache" >> "$GITHUB_ENV"
          echo "SCCACHE_CACHE_SIZE=1G" >> "$GITHUB_ENV"

      - name: Restore the compiler cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/sccache-cache
          key: sccache-macos-build-1-${{ github.sha }}
          restore-keys: sccache-macos-build-1-

      - name: Build full app
        run: |
          cmake -B build -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR" -DPython3_EXECUTABLE="$RUNNER_TEMP/py/bin/python"             -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache             -DCMAKE_OBJCXX_COMPILER_LAUNCHER=sccache
          cmake --build build
          sccache --show-stats | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Save the compiler cache (dev and main)
        if: matrix.shard == 1 && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/sccache-cache
          key: sccache-macos-build-1-${{ github.sha }}

      # ECUIO_PYTEST_REQUIRED: PythonTest.* fail rather than skip without
      # pytest
      - name: Run tests
        env:
          ECUIO_PYTEST_REQUIRED: '1'
        run: ctest --test-dir build --output-on-failure --no-tests=error -I ${{ matrix.shard }},,2

      # A manual run's regex reaches the shell only through env.
      - name: Repeat until a failure (manual runs)
        if: ${{ inputs.macos_repeat != '' && matrix.shard == 1 }}
        env:
          REPEAT_REGEX: ${{ inputs.macos_repeat }}
          REPEAT_COUNT: ${{ inputs.macos_repeat_count }}
        run: |
          ctest --test-dir build --output-on-failure --no-tests=error \
            -R "$REPEAT_REGEX" --repeat "until-fail:$REPEAT_COUNT"

  linux-build:
    name: linux-build (${{ matrix.shard }}/2)
    if: ${{ !inputs.smoke_only }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Two runners, each with its own build, run alternate halves of ctest
    # (-I k,,2: every case once across the two); the steps after the tests
    # run on the first
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Qt 6.7+ names the Linux desktop arch linux_gcc_64 (gcc_64 no
      # longer resolves for 6.12.0).
      - name: Install Qt 6.12.0 desktop (linux_gcc_64)
        uses: jurplel/install-qt-action@b344308e4483fc892e0d27b3cd1b173ebdd95f06 # v4.5.0
        with:
          cache: true
          version: '6.12.0'
          host: 'linux'
          target: 'desktop'
          arch: 'linux_gcc_64'

      # pytest for PythonTest.* (the havne package against the shared
      # core), in a venv the configure takes as the tests' Python, as
      # core-and-tests does; --system-site-packages, so it still sees
      # what the runner's Python has (jsonschema, where it does). The
      # package needs Python 3.11 or later
      - name: Install pytest
        run: |
          python3 -m venv --system-site-packages "$RUNNER_TEMP/py"
          "$RUNNER_TEMP/py/bin/python" -c 'import sys; assert sys.version_info >= (3, 11), sys.version'
          "$RUNNER_TEMP/py/bin/python" -m pip install --require-hashes -r .github/pytest-requirements.txt

      # sccache from its GitHub release, checked against the SHA-256 that
      # the release publishes, as win-build's; read on every ref, saved by
      # the first shard on dev and main only
      - name: Install sccache
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v0.19.0 -R mozilla/sccache -p sccache-v0.19.0-x86_64-unknown-linux-musl.tar.gz -O "$RUNNER_TEMP/sccache.tar.gz" --clobber
          echo "aa73c7270c997894038c0d8f0d297865f57569e1687883322bc431713d4bb9dd  $RUNNER_TEMP/sccache.tar.gz" | sha256sum -c -
          mkdir "$RUNNER_TEMP/sccache-bin"
          tar -xzf "$RUNNER_TEMP/sccache.tar.gz" -C "$RUNNER_TEMP/sccache-bin" --strip-components 1
          echo "$RUNNER_TEMP/sccache-bin" >> "$GITHUB_PATH"
          echo "SCCACHE_DIR=$RUNNER_TEMP/sccache-cache" >> "$GITHUB_ENV"
          echo "SCCACHE_CACHE_SIZE=1G" >> "$GITHUB_ENV"

      - name: Restore the compiler cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/sccache-cache
          key: sccache-linux-build-1-${{ github.sha }}
          restore-keys: sccache-linux-build-1-

      # libegl1 and libopengl0: QtGui's runtime libraries, which test_qml
      # loads (offscreen, so nothing for X11 or a GPU); systemtap-sdt-dev
      # and bpftrace: core's USDT probes and the step that traces them;
      # can-utils: candump, which CliTransferRunTest.candump logs vcan0
      # with (ECUIO_VCAN_REQUIRED fails it without one)
      - name: Build full app
        run: |
          sudo apt-get update && sudo apt-get install -y libgl1-mesa-dev libxkbcommon-dev libegl1 libopengl0 \
            systemtap-sdt-dev bpftrace can-utils
          cmake -B build -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR" -DPython3_EXECUTABLE="$RUNNER_TEMP/py/bin/python" \
            -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache
          cmake --build build
          sccache --show-stats | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Save the compiler cache (dev and main)
        if: matrix.shard == 1 && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/sccache-cache
          key: sccache-linux-build-1-${{ github.sha }}
      # The simulated CAN bus (tests/vcan_bus.h): vcan and can-isotp load
      # as installed on the hosted Ubuntu runners. MTU 72 takes CAN FD
      # frames (the mock's 16-byte telemetry), whatever the kernel's
      # default; it's set before the link goes up, as vcan requires
      - name: Bring up vcan0
        run: |
          sudo modprobe vcan
          sudo modprobe can-isotp
          sudo ip link add dev vcan0 type vcan
          sudo ip link set vcan0 mtu 72
          sudo ip link set up vcan0
      # ECUIO_VCAN_REQUIRED: test_vcan's suites, CliPluginRunTest and
      # PythonTest.test_vcan (v0.6.0's "a Python script opens SocketCAN")
      # fail rather than skip without vcan0; ECUIO_PYTEST_REQUIRED:
      # PythonTest.* fail rather than skip without pytest
      - name: Run tests
        env:
          ECUIO_VCAN_REQUIRED: '1'
          ECUIO_PYTEST_REQUIRED: '1'
        run: ctest --test-dir build --output-on-failure --no-tests=error -I ${{ matrix.shard }},,2
      # The one SocketCAN case that sets the interface down and up again
      # needs CAP_NET_ADMIN; it skips in the run above, and runs here
      - name: SocketCAN as root (the interface down and up)
        if: matrix.shard == 1
        env:
          ECUIO_VCAN_REQUIRED: '1'
          ECUIO_VCAN_ROOT_REQUIRED: '1'
        run: >-
          sudo --preserve-env=ECUIO_VCAN_REQUIRED,ECUIO_VCAN_ROOT_REQUIRED
          build/tests/test_vcan
          --gtest_filter='SocketCanBusTest.TheInterfaceGoingDownIsAHardFailureThatRecovers'
      # Core's probes fire in a running program (ADR-0034 section 4): bpftrace
      # attaches to havne-cli's and counts a mock:// stream's
      - name: USDT probes under bpftrace
        if: matrix.shard == 1
        run: sudo sh tests/probe_trace.sh build/cli/havne-cli
      - name: Load test
        if: matrix.shard == 1
        shell: bash   # -o pipefail: tee must not hide the bench's exit status
        run: build/tests/bench_bridge --load | tee -a "$GITHUB_STEP_SUMMARY"

  # The Linux AppImage (packaging/linux/make-appimage.sh), on the oldest
  # Ubuntu it supports: an AppImage runs where glibc is at least its
  # build machine's. One per architecture: x86_64, and aarch64 on
  # GitHub's ARM runner
  linux-appimage:
    if: ${{ !inputs.smoke_only }}
    name: linux-appimage (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, runner: ubuntu-24.04, qt_host: linux, qt_arch: linux_gcc_64 }
          - { arch: aarch64, runner: ubuntu-24.04-arm, qt_host: linux_arm64, qt_arch: linux_gcc_arm64 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Qt 6.12.0 desktop (${{ matrix.qt_arch }})
        uses: jurplel/install-qt-action@b344308e4483fc892e0d27b3cd1b173ebdd95f06 # v4.5.0
        with:
          cache: true
          version: '6.12.0'
          host: ${{ matrix.qt_host }}
          target: 'desktop'
          arch: ${{ matrix.qt_arch }}

      # rcc's embedded files and the squashfs take the commit's time, not
      # the checkout's, so two builds of one commit match (ADR-0035 section 4)
      - name: Date the build by the commit
        run: |
          t=$(git log -1 --format=%ct)
          echo "SOURCE_DATE_EPOCH=$t" >> "$GITHUB_ENV"
          echo "QT_RCC_SOURCE_DATE_OVERRIDE=$t" >> "$GITHUB_ENV"

      # The xcb platform plugin's libraries, which linuxdeploy bundles
      - name: Build the Release app
        run: |
          sudo apt-get update && sudo apt-get install -y libgl1-mesa-dev libxkbcommon-dev libegl1 libopengl0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-shape0 libxcb-sync1 libxcb-xfixes0 libxcb-xinerama0 libxcb-xkb1 libxkbcommon-x11-0 \
            systemtap-sdt-dev
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR"
          cmake --build build

      # linuxdeploy and its Qt plugin, which make-appimage.sh downloads
      # from GitHub's releases (curl with retries, then the API through
      # gh, since the asset URLs' host can answer 504 for long stretches)
      # and checks by SHA-256 either way. Keyed on the script, which pins
      # them; one copy an arch, saved on main's pushes only.
      - name: Restore linuxdeploy from the cache
        id: linuxdeploy-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/havne-linuxdeploy
          key: linuxdeploy-${{ runner.arch }}-${{ hashFiles('packaging/linux/make-appimage.sh') }}

      - name: Pack and check the AppImage
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(sed -n '/^project(Havne/,/)/s/^ *VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          QMAKE="$QT_ROOT_DIR/bin/qmake" bash packaging/linux/make-appimage.sh "$VERSION-ci" build dist
          sha256sum dist/*.AppImage

      - name: Save linuxdeploy to the cache (main only)
        if: steps.linuxdeploy-cache.outputs.cache-hit != 'true' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/havne-linuxdeploy
          key: ${{ steps.linuxdeploy-cache.outputs.cache-primary-key }}

      - name: Upload the AppImage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: havne-linux-${{ matrix.arch }}
          path: dist/*.AppImage
          if-no-files-found: error
          retention-days: 14

  # The core packages (ADR-0035): a deb, its -dbgsym and two tarballs,
  # on 24.04 like the release's. Built twice by reprotest, the second
  # time in another folder, locale, time zone, umask, CPU count and so on;
  # every byte must match. user_group is left out: it needs other
  # accounts on the runner. Then installed and used as a user would.
  # One per architecture, as linux-appimage.
  linux-packages:
    if: ${{ !inputs.smoke_only }}
    name: linux-packages (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, debarch: amd64, runner: ubuntu-24.04 }
          - { arch: aarch64, debarch: arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Without recommends: diffoscope's full form recommends a long list
      # of comparison tools (ghc alone is 79 MB), which a slow archive
      # mirror took past the job's timeout. reprotest's own recommends
      # are named instead (its variations' tools), with diffoscope-minimal,
      # which compares the packages if a build differs
      - name: Install the tools
        timeout-minutes: 8
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build dpkg-dev \
            systemtap-sdt-dev reprotest disorderfs faketime locales-all \
            diffoscope-minimal gdb pkg-config

      - name: Build twice under reprotest
        run: |
          VERSION=$(sed -n '/^project(Havne/,/)/s/^ *VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          echo "VERSION=$VERSION-ci" >> "$GITHUB_ENV"
          SOURCE_DATE_EPOCH=$(git log -1 --format=%ct) reprotest --min-cpus="$(nproc)" \
            --variations=-user_group \
            "bash packaging/linux/make-core-packages.sh $VERSION-ci build-packages dist" 'dist/*'

      - name: Build, install and use
        run: |
          bash packaging/linux/make-core-packages.sh "$VERSION" build-packages dist
          bash tests/package_check.sh dist "$VERSION"

      # packaging/sbom.py over these packages' component lists, and its
      # self-test's document, each validated as the release's is
      - name: The SBOM
        run: |
          python3 -m venv "$RUNNER_TEMP/spdx"
          "$RUNNER_TEMP/spdx/bin/pip" install --require-hashes -r .github/spdx-requirements.txt
          python3 packaging/sbom.py selftest --out "$RUNNER_TEMP/selftest.spdx.json"
          python3 packaging/sbom.py build --version "$VERSION" --tag "v$VERSION" --out "$RUNNER_TEMP/core.spdx.json" \
            "dist/havne-core_${VERSION}_${{ matrix.debarch }}.deb" "dist/havne-core-$VERSION-linux-${{ matrix.arch }}.tar.gz"
          for f in selftest core; do "$RUNNER_TEMP/spdx/bin/pyspdxtools" -i "$RUNNER_TEMP/$f.spdx.json"; done

      - name: Upload the packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: havne-core-linux-${{ matrix.arch }}
          path: dist/havne-core*
          if-no-files-found: error
          retention-days: 14

  # Cross builds (Android, iOS) are build-only: BUILD_TESTING=OFF, because
  # gtest_discover_tests runs each test binary at build time, which can't
  # work for a target the runner can't execute.
  # Waits for core-and-tests, the short job that frees its runner first: a
  # manual run has more jobs than the account's 20 concurrent runners, and this
  # one starts in that slot, whatever core-and-tests did
  android-build:
    needs: core-and-tests
    if: ${{ (success() || failure()) && !inputs.smoke_only }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Qt 6.7+ publishes Android kits under the all_os host. A mobile kit
      # needs the desktop Qt of the build host too; --autodesktop installs it.
      # qtconnectivity is QtBluetooth, the phone's links (ADR-0028 section 2).
      - name: Install Qt 6.12.0 (android_arm64_v8a + linux host)
        uses: jurplel/install-qt-action@b344308e4483fc892e0d27b3cd1b173ebdd95f06 # v4.5.0
        with:
          cache: true
          version: '6.12.0'
          host: 'all_os'
          target: 'android'
          arch: 'android_arm64_v8a'
          modules: 'qtconnectivity'
          extra: '--autodesktop'

      # Qt 6.12 for Android wants NDK r27 and JDK 21. The Ubuntu 24.04 and
      # 26.04 images both ship them (NDK 27.x is ANDROID_NDK_ROOT's
      # default; JDK 21 is JAVA_HOME_21_X64), but image defaults move with
      # image updates. Select both by version and fail clearly if either
      # is gone, rather than building with whatever the default became.
      - name: Select NDK r27 and JDK 21
        run: |
          # "|| true": with no match, ls fails, and under the runner's
          # -eo pipefail that would exit here, before the error below.
          NDK=$(ls -d "$ANDROID_SDK_ROOT"/ndk/27.* 2>/dev/null | sort -V | tail -n 1 || true)
          if [ -z "$NDK" ]; then
            echo "::error::No NDK r27 under $ANDROID_SDK_ROOT/ndk"
            ls "$ANDROID_SDK_ROOT/ndk"
            exit 1
          fi
          if [ -z "${JAVA_HOME_21_X64:-}" ]; then
            echo "::error::JAVA_HOME_21_X64 is not set on this runner image"
            exit 1
          fi
          echo "APP_NDK_ROOT=$NDK" >> "$GITHUB_ENV"
          echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"
          echo "NDK $(basename "$NDK")"
          "$JAVA_HOME_21_X64/bin/java" -version

      # Gradle's distribution (the wrapper Qt's template names) and the
      # Android build's dependencies, from services.gradle.org and Maven,
      # whose 504s have failed the job. Keyed on the Qt version, whose
      # template pins both; one copy, saved on main's pushes only, which
      # every other ref reads. A miss downloads as before.
      - name: Restore Gradle's downloads from the cache
        id: gradle-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/wrapper/dists
            ~/.gradle/caches/modules-2
            !~/.gradle/caches/modules-2/*.lock
          key: gradle-android-qt-6.12.0

      - name: Build APK
        run: |
          ls "$(dirname "$QT_ROOT_DIR")"
          "$QT_ROOT_DIR/bin/qt-cmake" -B build \
            -DBUILD_TESTING=OFF \
            -DANDROID_SDK_ROOT="$ANDROID_SDK_ROOT" \
            -DANDROID_NDK_ROOT="$APP_NDK_ROOT"
          cmake --build build
          cmake --build build --target apk

      - name: Save Gradle's downloads to the cache (main only)
        if: steps.gradle-cache.outputs.cache-hit != 'true' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/wrapper/dists
            ~/.gradle/caches/modules-2
            !~/.gradle/caches/modules-2/*.lock
          key: ${{ steps.gradle-cache.outputs.cache-primary-key }}

      # Core's TCP socket needs INTERNET; Bluetooth needs CONNECT and SCAN,
      # the scan never for location, on Android 12 and later (ADR-0028 section 2
      # and its appendix of 2026-10-28). A manifest without them fails
      # here, not on a phone.
      - name: Check the manifest's permissions, minimum SDK and icon
        run: |
          MANIFEST=$(find build -path '*android-build*' -name AndroidManifest.xml -not -path '*/intermediates/*' | head -n 1)
          if [ -z "$MANIFEST" ]; then
            echo "::error::No generated AndroidManifest.xml under build/"
            exit 1
          fi
          echo "$MANIFEST"
          grep -n 'uses-permission' "$MANIFEST"
          grep -q 'android.permission.INTERNET' "$MANIFEST" \
            || { echo "::error::$MANIFEST declares no INTERNET permission"; exit 1; }
          grep -q 'android.permission.BLUETOOTH_CONNECT' "$MANIFEST" \
            || { echo "::error::$MANIFEST declares no BLUETOOTH_CONNECT permission"; exit 1; }
          grep 'android.permission.BLUETOOTH_SCAN' "$MANIFEST" | grep -q 'neverForLocation' \
            || { echo "::error::$MANIFEST declares no BLUETOOTH_SCAN never for location"; exit 1; }
          if grep -q 'ACCESS_FINE_LOCATION' "$MANIFEST"; then
            echo "::warning::$MANIFEST asks for location, which the BLE scan doesn't need"
          fi
          # The minimum SDK, in androiddeployqt's gradle.properties or the
          # manifest itself
          BUILD_DIR=$(dirname "$MANIFEST")
          grep -n -E 'qtMinSdkVersion|minSdkVersion' "$BUILD_DIR/gradle.properties" "$MANIFEST" 2>/dev/null || true
          grep -q -E '(qtMinSdkVersion *= *31|minSdkVersion="31")' "$BUILD_DIR/gradle.properties" "$MANIFEST" 2>/dev/null \
            || { echo "::error::the app's minimum SDK isn't 31 (Android 12)"; exit 1; }
          # The package id (permanent: another is another app) and the
          # version from project() (ADR-0001's appendix of 2026-10-28)
          VERSION=$(sed -n '/^project(Havne/,/)/s/^ *VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          grep -n -E 'package=|versionName|versionCode' "$MANIFEST"
          grep -q 'package="io.github.erickramer42.havne"' "$MANIFEST" \
            || { echo "::error::$MANIFEST's package isn't io.github.erickramer42.havne"; exit 1; }
          grep -q "android:versionName=\"$VERSION\"" "$MANIFEST" \
            || { echo "::error::$MANIFEST's version name isn't $VERSION"; exit 1; }
          # The launcher's label, capitalized (QT_ANDROID_APP_NAME)
          grep -q 'android:label="Havne"' "$MANIFEST" \
            || { echo "::error::$MANIFEST's label isn't Havne"; exit 1; }
          # QT_ANDROID_APP_ICON's adaptive icon, not Qt's default
          grep -n 'android:icon' "$MANIFEST"
          grep -q 'android:icon="@mipmap/ic_launcher"' "$MANIFEST" \
            || { echo "::error::$MANIFEST doesn't name @mipmap/ic_launcher"; exit 1; }
          # Background sessions (ADR-0029): Qt's GUI loop kept running, and
          # the foreground service with its permissions and wake lock
          grep -A1 'android.app.background_running' "$MANIFEST" | grep -q 'android:value="true"' \
            || { echo "::error::$MANIFEST doesn't set android.app.background_running to true"; exit 1; }
          grep -A3 'SessionService' "$MANIFEST" | grep -q 'foregroundServiceType="connectedDevice"' \
            || { echo "::error::$MANIFEST has no SessionService of type connectedDevice"; exit 1; }
          for p in FOREGROUND_SERVICE FOREGROUND_SERVICE_CONNECTED_DEVICE CHANGE_NETWORK_STATE POST_NOTIFICATIONS WAKE_LOCK; do
            grep -q "android.permission.$p\"" "$MANIFEST" \
              || { echo "::error::$MANIFEST declares no $p permission"; exit 1; }
          done
          # No backup: the app's files can hold the VIN (docs/security-assurance.md)
          grep -q 'android:allowBackup="false"' "$MANIFEST" \
            || { echo "::error::$MANIFEST doesn't turn backup off"; exit 1; }
          grep -q 'android:dataExtractionRules="@xml/data_extraction_rules"' "$MANIFEST" \
            || { echo "::error::$MANIFEST names no data extraction rules"; exit 1; }

      # The debug-signed APK, for sideloading onto a phone (ADR-0028 section 3).
      # Each run signs with a new debug key, so a phone uninstalls the
      # previous build before installing the next.
      - name: Upload APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: havne-android-arm64-v8a
          path: build/**/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14

  ios-build:
    if: ${{ !inputs.smoke_only }}
    runs-on: macos-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The iOS kit is the largest cache entry (about 3.5 GiB): a copy
      # per branch takes the repository past the Actions cache's 10 GB
      # and evicts the other kits, so only main saves it; every ref
      # restores it (a restore keeps main's entry recently used). The key
      # is ours, not install-qt-action's own (that one holds the runner's
      # kernel version, so a runner update would miss on every branch): it
      # names what decides the install's bytes, so change it with the
      # version, target or aqtinstall.
      - name: Restore the iOS Qt kit from the cache
        id: qt-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/Qt
          key: qt-ios-6.12.0-ios-autodesktop-aqt-3.3-arm64-1

      - name: Install Qt 6.12.0 (ios + macOS host)
        if: steps.qt-cache.outputs.cache-hit != 'true'
        uses: jurplel/install-qt-action@b344308e4483fc892e0d27b3cd1b173ebdd95f06 # v4.5.0
        with:
          cache: false
          dir: ${{ github.workspace }}/Qt
          version: '6.12.0'
          host: 'mac'
          target: 'ios'
          arch: 'ios'
          extra: '--autodesktop'

      - name: Save the iOS Qt kit to the cache (main only)
        if: steps.qt-cache.outputs.cache-hit != 'true' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/Qt
          key: ${{ steps.qt-cache.outputs.cache-primary-key }}

      # What install-qt-action exports after an install, for the restored
      # kit: the build below needs QT_ROOT_DIR and QT_HOST_PATH
      - name: Point the build at the restored kit
        if: steps.qt-cache.outputs.cache-hit == 'true'
        run: |
          kit="${{ github.workspace }}/Qt/6.12.0"
          {
            echo "QT_ROOT_DIR=$kit/ios"
            echo "QT_HOST_PATH=$kit/macos"
            echo "QT_PLUGIN_PATH=$kit/ios/plugins"
            echo "QML2_IMPORT_PATH=$kit/ios/qml"
          } >> "$GITHUB_ENV"
          echo "$kit/ios/bin" >> "$GITHUB_PATH"

      - name: Check the kit is there
        run: |
          test -x "$QT_ROOT_DIR/bin/qt-cmake" || { echo "::error::no qt-cmake under $QT_ROOT_DIR"; exit 1; }
          test -d "$QT_HOST_PATH/bin" || { echo "::error::no host Qt at $QT_HOST_PATH"; exit 1; }

      # qt-cmake applies Qt's iOS toolchain and its minimum deployment
      # target (iOS 18 for Qt 6.12), so neither is set by hand.
      - name: Build for device (no code signing)
        run: |
          ls "$(dirname "$QT_ROOT_DIR")"
          "$QT_ROOT_DIR/bin/qt-cmake" -B build -G Xcode \
            -DBUILD_TESTING=OFF \
            -DCMAKE_OSX_ARCHITECTURES=arm64
          cmake --build build --config Release -- CODE_SIGNING_ALLOWED=NO

      # The device build as an unsigned .ipa, for sideloading
      # (docs/ios.md): the tester's own tool signs it with their Apple ID,
      # so the file carries no provisioning profile and no device's ID.
      # Fails if the bundle lacks app/ios/Info.plist.in's keys, its versions
      # aren't project()'s, or it holds a signature or a profile.
      - name: Package unsigned .ipa
        run: |
          app=$(find build -type d -name Havne.app -path '*Release-iphoneos*' | head -n 1)
          fail() { echo "::error::$1"; exit 1; }
          [ -n "$app" ] || fail "no Release-iphoneos/Havne.app under build/"
          key() { plutil -extract "$1" raw -o - "$app/Info.plist" 2>/dev/null; }
          [ "$(key CFBundleIdentifier)" = io.github.erickramer42.havne ] ||
            fail "CFBundleIdentifier is '$(key CFBundleIdentifier)'"
          [ -n "$(key NSLocalNetworkUsageDescription)" ] ||
            fail "no NSLocalNetworkUsageDescription in Info.plist"
          [ "$(key UIFileSharingEnabled)" = true ] ||
            fail "UIFileSharingEnabled isn't true in Info.plist"
          [ "$(key LSSupportsOpeningDocumentsInPlace)" = true ] ||
            fail "LSSupportsOpeningDocumentsInPlace isn't true in Info.plist"
          VERSION=$(sed -n '/^project(Havne/,/)/s/^ *VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          [ -n "$VERSION" ] || fail "no VERSION in project(Havne ...)"
          for k in CFBundleShortVersionString CFBundleVersion; do
            [ "$(key $k)" = "$VERSION" ] || fail "$k is '$(key $k)', not $VERSION"
          done
          [ ! -e "$app/embedded.mobileprovision" ] || fail "a provisioning profile in the bundle"
          [ ! -e "$app/_CodeSignature" ] || fail "a signature in the bundle"
          echo "Havne $(key CFBundleShortVersionString) ($(key CFBundleVersion)), iOS $(key MinimumOSVersion) or later"
          mkdir -p ipa/Payload
          ditto "$app" ipa/Payload/Havne.app
          (cd ipa && zip -qry ../havne-ios-unsigned.ipa Payload)
          shasum -a 256 havne-ios-unsigned.ipa

      - name: Upload unsigned .ipa
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: havne-ios-arm64-unsigned
          path: havne-ios-unsigned.ipa
          if-no-files-found: error
          retention-days: 14

  # Launch smoke on the iOS Simulator: install, launch, and check the app
  # is still running 45 s later. Qt 6.12's simulator libraries are x86_64
  # only, so this runs on an Intel runner where the simulator is native.
  # GitHub has announced the end of Intel macOS runners for Fall 2027;
  # after that this needs Rosetta plus the universal iOS platform, or
  # arm64 simulator libraries from Qt.
  #
  # Runs on request only, not on pushes, pull requests or plain manual
  # runs: it takes 20-30 min against a few minutes for the rest of CI.
  # Request it with a manual run that ticks ios_smoke (the whole run) or
  # smoke_only (the smoke and core-and-tests alone), on any branch, or
  # with "[ios-smoke]" in the pushed commit's message. A re-run replays
  # the original event, so re-running a skipped smoke skips it again.
  ios-simulator-smoke:
    if: >-
      (github.event_name == 'workflow_dispatch' &&
      (inputs.ios_smoke || inputs.smoke_only)) ||
      (github.event_name == 'push' &&
      contains(github.event.head_commit.message, '[ios-smoke]'))
    runs-on: macos-15-intel
    # Runs have taken 19.5-24 min on the Intel runner.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Cached on main only, as ios-build's kit
      - name: Install Qt 6.12.0 (ios + macOS host)
        uses: jurplel/install-qt-action@b344308e4483fc892e0d27b3cd1b173ebdd95f06 # v4.5.0
        with:
          cache: ${{ github.ref == 'refs/heads/main' }}
          version: '6.12.0'
          host: 'mac'
          target: 'ios'
          arch: 'ios'
          extra: '--autodesktop'

      # Newest available iPhone on iOS 18 or later (Qt 6.12's floor). It
      # boots while the app builds; "Wait for simulator" joins it. That
      # also keeps the launch off a simulator still settling after a
      # cold boot, the likely cause of the first run's blank frame.
      - name: Pick and start simulator
        run: |
          UDID=$(xcrun simctl list devices available --json | jq -r '
            [.devices | to_entries[]
             | select(.key | test("SimRuntime\\.iOS-"))
             | (.key | capture("iOS-(?<maj>[0-9]+)-(?<min>[0-9]+)")
                     | [(.maj | tonumber), (.min | tonumber)]) as $v
             | select($v[0] >= 18)
             | .value[] | select(.name | startswith("iPhone"))
             | {udid, v: $v}]
            | sort_by(.v) | last | .udid // empty')
          if [ -z "$UDID" ]; then
            echo "::error::No available iPhone simulator on iOS 18 or later"
            xcrun simctl list devices available
            exit 1
          fi
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID"

      # Qt's toolchain leaves an explicit sysroot and arch alone, so these
      # select the simulator SDK and Qt's x86_64 simulator slice.
      - name: Build for simulator (x86_64, no code signing)
        run: |
          "$QT_ROOT_DIR/bin/qt-cmake" -B build -G Xcode \
            -DBUILD_TESTING=OFF \
            -DCMAKE_OSX_SYSROOT=iphonesimulator \
            -DCMAKE_OSX_ARCHITECTURES=x86_64
          cmake --build build --config Release -- CODE_SIGNING_ALLOWED=NO

      - name: Wait for simulator
        run: |
          xcrun simctl bootstatus "$UDID" -b
          # Qt Quick renders through Metal; record what the VM exposes.
          system_profiler SPDisplaysDataType | grep -iE 'chipset|metal' || true
          mkdir -p smoke
          # Control shot before the app exists: if the home screen is
          # blank too, the runner's simulator display is at fault.
          xcrun simctl io "$UDID" screenshot smoke/home.png || true

      # main() returns -1 when QML fails to load, and a scene graph that
      # can't initialize aborts, so "still running" covers both. It does
      # not prove the app drew anything; the screenshots are for that.
      - name: Launch and check Havne stays up
        run: |
          APP=$(find build -type d -name Havne.app -path '*iphonesimulator*' | head -n 1)
          if [ -z "$APP" ]; then
            echo "::error::Havne.app not found under build/"
            exit 1
          fi
          BUNDLE_ID=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist")
          xcrun simctl install "$UDID" "$APP"
          # SIMCTL_CHILD_* variables reach the app. Qt on Apple platforms
          # logs to os_log unless forced to stderr. QSG_INFO logs the
          # scene graph's backend and device once the window is exposed,
          # so no QSG_INFO lines means it never got that far.
          OUT=$(SIMCTL_CHILD_QT_FORCE_STDERR_LOGGING=1 SIMCTL_CHILD_QSG_INFO=1 \
            xcrun simctl launch \
            --stdout="$PWD/smoke/stdout.log" --stderr="$PWD/smoke/stderr.log" \
            "$UDID" "$BUNDLE_ID")
          PID="${OUT##*: }"
          echo "Launched $BUNDLE_ID as pid $PID"
          # Two shots, so a slow first frame on the Intel VM shows up as a
          # blank 15 s shot followed by a drawn 45 s one.
          sleep 15
          xcrun simctl io "$UDID" screenshot smoke/launch-15s.png || true
          sleep 30
          xcrun simctl io "$UDID" screenshot smoke/launch-45s.png || true
          echo "--- Havne stderr ---"
          cat smoke/stderr.log 2>/dev/null || true
          echo "--- end stderr ---"
          if grep -q "QML FAILED TO LOAD" smoke/stderr.log 2>/dev/null; then
            echo "::error::QML failed to load"
            exit 1
          fi
          if ! kill -0 "$PID" 2>/dev/null; then
            echo "::error::Havne exited within 45 s of launch"
            exit 1
          fi
          echo "Havne still running after 45 s"

      - name: Collect crash reports
        if: failure()
        run: |
          mkdir -p smoke
          cp ~/Library/Logs/DiagnosticReports/Havne* smoke/ 2>/dev/null || true

      - name: Upload smoke artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-simulator-smoke
          path: smoke/
          if-no-files-found: ignore
