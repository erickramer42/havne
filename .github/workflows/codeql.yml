name: CodeQL

# CodeQL static analysis, with results on the repository's code-scanning
# dashboard. It covers the C++ that Windows compiles in a core-only build
# (core, the J2534 layer and the surrogate, built x64; no Qt needed)
# and the workflows themselves. The app and its QML aren't analyzed.
# OpenSSF Scorecard's SAST check looks for this workflow.
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]
  schedule:
    - cron: '30 2 * * 1'

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write   # upload the results to code scanning
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: c-cpp
            os: windows-latest
            build-mode: manual
          - language: actions
            os: ubuntu-latest
            build-mode: none
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Build core, the J2534 layer and the surrogate
        if: matrix.build-mode == 'manual'
        run: |
          cmake -B build-core -DQTTUNE_BUILD_CORE_ONLY=ON -DBUILD_TESTING=OFF
          cmake --build build-core --config Release

      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:${{ matrix.language }}
