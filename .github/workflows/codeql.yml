name: CodeQL

# CodeQL static analysis, with results on the repository's code-scanning
# dashboard. It covers the C++ that Windows compiles in a core-only build
# (core, the J2534 layer and the surrogate, built x64; no Qt needed)
# and the workflows themselves. The app and its QML aren't analyzed.
# OpenSSF Scorecard's SAST check looks for this workflow.
# The PR to main and the merge's push, as ci.yml, and weekly
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '30 2 * * 1'
  workflow_dispatch:

permissions:
  contents: read

# A push to a PR's branch cancels the PR's analysis it supersedes
concurrency:
  group: codeql-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write   # upload the results to code scanning
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: c-cpp
            os: windows-latest
            build-mode: manual
          - language: actions
            os: ubuntu-latest
            build-mode: none
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: github/codeql-action/init@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          # paths-ignore doesn't apply to a compiled analysis: the "Drop
          # third_party/wamr" step filters its results out before the upload.
          # third_party/wamr_port.c is Havne's own and stays
          config: |
            paths-ignore:
              - third_party/wamr

      - name: Build core, the J2534 layer and the surrogate
        if: matrix.build-mode == 'manual'
        run: |
          cmake -B build-core -DHAVNE_BUILD_CORE_ONLY=ON -DBUILD_TESTING=OFF
          cmake --build build-core --config Release

      - uses: github/codeql-action/analyze@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        id: analyze
        with:
          category: /language:${{ matrix.language }}
          upload: never
          output: sarif-results

      - name: Drop third_party/wamr from the results
        env:
          SARIF_DIR: ${{ steps.analyze.outputs.sarif-output }}
        shell: bash
        run: |
          python - <<'PY'
          import glob, json, os
          for path in glob.glob(os.path.join(os.environ["SARIF_DIR"], "*.sarif")):
              with open(path, encoding="utf-8") as f:
                  doc = json.load(f)
              for run in doc.get("runs", []):
                  def vendored(r):
                      return any(
                          loc.get("physicalLocation", {})
                          .get("artifactLocation", {})
                          .get("uri", "")
                          .startswith("third_party/wamr/")
                          for loc in r.get("locations", [])
                      )
                  kept = [r for r in run.get("results", []) if not vendored(r)]
                  print(f"{path}: kept {len(kept)} of {len(run.get('results', []))}")
                  run["results"] = kept
              with open(path, "w", encoding="utf-8") as f:
                  json.dump(doc, f)
          PY

      - uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          sarif_file: ${{ steps.analyze.outputs.sarif-output }}
          category: /language:${{ matrix.language }}
